name: Deploy Site lists

on:
  push:
    branches: [main]
    paths: ["src/**", "scripts/**", "wrangler.jsonc", ".github/workflows/deploy.yml"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The gate: nothing goes out that does not pass its own checks.
      - name: Parser, matcher, Accept row
        run: node scripts/probar-listas.mjs
      - name: Worker against a stand-in for Google
        run: node scripts/probar-worker.mjs

      - name: Build dist/
        run: |
          mkdir -p dist
          cp src/index.html dist/index.html
          cp src/site-lists.js dist/site-lists.js

      # Secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID: the same two
      # the desk's repository uses, copied into this repository's settings.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
