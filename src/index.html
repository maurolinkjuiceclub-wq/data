<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Site lists: paste what a publisher or broker sent, match it against the
     database, decide every row. The parsing and matching live in
     site-lists.js (tested by scripts/probar-listas.mjs); this file is only
     the screen. Plan and decisions: BRIEF.md. -->
<title>LJC Site Lists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Same system as the desk (src/mesa.html): dark by default in neutral greys, a surface scale instead of borders, one blue accent; green and amber mean state, never decoration. Layout: the desk's bar on top, then a full-width work screen like "Our outreach". */
:root{
  --paper:#161616; --surface:#1e1e1e; --surface-2:#252525; --surface-3:#2f2f2f;
  --ink:#ededed; --ink-2:#b9b9b9; --muted:#8d8d8d; --line:#2c2c2c; --line-strong:#414141;
  --accent:#6ea8fe; --accent-ink:#9cc4ff; --accent-wash:#1c2534;
  --ok-bg:#16301f; --ok-ink:#7fd39b; --ok-line:#3f8a58;
  --wait-bg:#33260f; --wait-ink:#e8b565; --wait-line:#9a7a3a;
  --bad:#e0645b; --bad-ink:#f08a82; --bad-bg:#3a1f1d; --bad-line:#6e3531;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px -16px rgba(0,0,0,.9);
  --radio:8px;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]){
  --paper:#f6f6f6; --surface:#ffffff; --surface-2:#efefef; --surface-3:#e4e4e4;
  --ink:#161616; --ink-2:#3d3d3d; --muted:#6b6b6b; --line:#e3e3e3; --line-strong:#cbcbcb;
  --accent:#1f5fd0; --accent-ink:#164aa6; --accent-wash:#e9effb;
  --ok-bg:#ddf2e4; --ok-ink:#1a6b3c; --ok-line:#a6dcba;
  --wait-bg:#fcecd4; --wait-ink:#8a5000; --wait-line:#eecb94;
  --bad:#c0392b; --bad-ink:#b3261e; --bad-bg:#fbe5e2; --bad-line:#eeb3ab;
  --shadow:0 1px 2px rgba(16,24,40,.04); color-scheme:light } }
:root[data-theme="light"]{
  --paper:#f6f6f6; --surface:#ffffff; --surface-2:#efefef; --surface-3:#e4e4e4;
  --ink:#161616; --ink-2:#3d3d3d; --muted:#6b6b6b; --line:#e3e3e3; --line-strong:#cbcbcb;
  --accent:#1f5fd0; --accent-ink:#164aa6; --accent-wash:#e9effb;
  --ok-bg:#ddf2e4; --ok-ink:#1a6b3c; --ok-line:#a6dcba;
  --wait-bg:#fcecd4; --wait-ink:#8a5000; --wait-line:#eecb94;
  --bad:#c0392b; --bad-ink:#b3261e; --bad-bg:#fbe5e2; --bad-line:#eeb3ab;
  --shadow:0 1px 2px rgba(16,24,40,.04); color-scheme:light }
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---------- the bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:0 16px;min-height:46px;background:var(--surface);border-bottom:1px solid var(--line)}
.marca{font-weight:600;font-size:14px;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;margin:0}
.estado{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 0;font-size:12px;color:var(--muted)}
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.lang button{background:var(--surface);border:0;padding:3px 8px;cursor:pointer;font-size:10.5px;letter-spacing:.05em;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.sello{font-family:var(--mono);font-size:11px;color:var(--muted);background:none;border:1px solid transparent;border-radius:6px;padding:3px 7px;white-space:nowrap}

/* ---------- database panel, behind its seal ---------- */
.sello{cursor:pointer}
.sello:hover,.sello[aria-expanded="true"]{border-color:var(--line-strong);color:var(--ink)}
.dbpanel{background:var(--surface);border-bottom:1px solid var(--line)}
.dbpanel-in{display:grid;gap:12px;padding:14px 16px;max-width:980px}
@media (min-width:720px){.dbpanel-in{padding:14px 24px}}
.lbl,.rev-form label,.dbpanel label{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.par{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr))}
input[type=file]{font-size:12.5px;color:var(--ink-2);max-width:100%}
.dbmeta{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere;margin-right:auto}

/* ---------- shell: the list on a rail, the work beside it ---------- */
.shell{display:grid;grid-template-columns:minmax(0,1fr);gap:0;min-height:calc(100vh - 46px)}
@media (min-width:900px){.shell{grid-template-columns:360px minmax(0,1fr)}}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:16px}
.work{padding:16px;min-width:0}
@media (min-width:720px){.rail{padding:18px 20px}.work{padding:18px 24px 60px}}
.rev-form{display:grid;gap:12px;margin:0;align-content:start;min-width:0}
.rev-form input[type=text],.rev-form textarea{width:100%;padding:7px 9px;border-radius:7px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);font:inherit;font-size:13px}
.rev-form textarea{min-height:260px;resize:vertical;font-family:var(--mono);font-size:12px;line-height:1.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
.btn.primary:hover{filter:brightness(1.08);color:var(--surface);border-color:var(--accent)}
.btn.sutil{border-color:transparent;background:none;color:var(--muted);font-size:12.5px;padding:8px 8px}
.btn.sutil:hover{color:var(--accent-ink);border-color:var(--line-strong)}
.said{font-size:12.5px;color:var(--muted);margin:0}

/* ---------- the work: one table, group tabs above it ---------- */
.gtabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);padding-bottom:0;margin-bottom:12px}
.gtab{background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.gtab:hover{color:var(--ink)}
.gtab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.gtab .n{font-family:var(--mono);font-size:10.5px;font-variant-numeric:tabular-nums;border-radius:20px;padding:1px 6px;min-width:18px;text-align:center;background:var(--surface-3);color:var(--ink-2)}
.gtab[aria-selected="true"] .n{background:var(--accent);color:var(--surface)}
.gtab.ok .n{background:var(--ok-bg);color:var(--ok-ink)}
.gtab.wait .n{background:var(--wait-bg);color:var(--wait-ink)}
.gtab[aria-selected="true"].ok .n,.gtab[aria-selected="true"].wait .n{background:var(--accent);color:var(--surface)}
.progreso{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);padding:6px 0;font-variant-numeric:tabular-nums}
.progreso i{display:block;width:96px;height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.progreso i b{display:block;height:100%;background:var(--accent);width:0}
@media (prefers-reduced-motion:no-preference){.progreso i b{transition:width .2s}}
.aviso{border:1px solid var(--wait-line);background:var(--wait-bg);color:var(--wait-ink);border-radius:7px;padding:8px 12px;margin:0 0 12px;font-size:12.5px}
.ghint{font-size:12px;color:var(--muted);margin:0 0 8px}
.tabla-wrap{overflow-x:auto;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);box-shadow:var(--shadow)}
table.outreach{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%}
table.outreach th,table.outreach td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
table.outreach thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);border-bottom:1px solid var(--line-strong);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
table.outreach td{font-family:var(--mono);font-variant-numeric:tabular-nums}
table.outreach td.dom{font-weight:600;font-size:13px}
table.outreach td.ancha{white-space:normal;min-width:120px;max-width:240px;width:18%;font-family:var(--sans);font-size:12.5px;color:var(--ink-2)}
table.outreach tbody tr:hover td{background:var(--accent-wash)}
table.outreach tbody tr:last-child td{border-bottom:0}
table.outreach tr.done td{opacity:.55}
table.outreach tr.done td.dec,table.outreach tr.done td.dom{opacity:1}
table.outreach tr.done td.dom{color:var(--muted)}
.pr{display:block;font-size:12px;line-height:1.6}
.pr.cambia{color:var(--ok-ink);font-weight:600}
.pr .k{display:inline-block;min-width:5.2em;color:var(--muted);font-weight:400}
.sender{display:block;font-size:10.5px;color:var(--muted);font-family:var(--sans);line-height:1.5;white-space:normal;max-width:260px}
.tipo{display:inline-block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;border:1px solid var(--line-strong);border-radius:4px;padding:0 4px;margin-right:5px;color:var(--ink-2);font-family:var(--sans)}
.tipo.broker{border-color:var(--wait-line);color:var(--wait-ink)}
.dbrow+.dbrow{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line-strong)}
td.dec{white-space:nowrap;width:1%;vertical-align:top}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{background:var(--surface);border:0;border-right:1px solid var(--line-strong);padding:5px 10px;font-size:12px;cursor:pointer;color:var(--ink-2);font-family:var(--sans);white-space:nowrap}
.seg button:last-child{border-right:0}
/* Four decisions in a 2 by 2 block, so the column stays narrow. */
td.dec .seg{display:inline-grid;grid-template-columns:1fr 1fr}
td.dec .seg button{border-right:0;border-bottom:1px solid var(--line-strong);border-left:1px solid var(--line-strong);text-align:left}
td.dec .seg button:nth-child(odd){border-left:0}
td.dec .seg button:nth-child(n+3){border-bottom:0}
.seg button:hover{color:var(--ink);background:var(--surface-2)}
.seg .on-accept{background:var(--ok-bg);color:var(--ok-ink);font-weight:600}
.seg .on-reject{background:var(--bad-bg);color:var(--bad-ink);font-weight:600}
.seg .on-ask{background:var(--wait-bg);color:var(--wait-ink);font-weight:600}
.empty{color:var(--muted);font-style:italic;padding:14px 12px;font-size:13px}
.seg .on-type{background:var(--accent-wash);color:var(--accent-ink);font-weight:600}
.seg.stype button{padding:6px 12px;font-size:12.5px}
.seg .on-webmaster{background:var(--accent-wash);color:var(--accent-ink);font-weight:600}
.delta{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.delta.up{color:var(--wait-ink)}
.delta.down{color:var(--ok-ink)}
.fv{display:inline-block;font-family:var(--sans);font-size:11px;border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;margin:0 4px 3px 0;color:var(--ink-2);background:var(--surface-2)}
.fv.off{border-style:dashed;color:var(--muted);background:none}
.raw{display:block;font-size:11px;color:var(--muted);margin-top:2px;white-space:normal}
.export table.outreach td{white-space:normal}
.export table.outreach td.dom{white-space:nowrap}
.aviso.acc{border-color:var(--accent);background:var(--accent-wash);color:var(--accent-ink)}

/* ---------- export, folded ---------- */
.export{margin-top:22px;border-top:1px solid var(--line);padding-top:10px}
.panel-h{width:100%;display:flex;align-items:center;gap:8px;background:transparent;border:0;cursor:pointer;padding:6px 2px;text-align:left;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.panel-h:hover{color:var(--ink)}
.panel-h .caret{font-size:9px;transition:transform .15s}
.panel-h[aria-expanded="false"] .caret{transform:rotate(-90deg)}
@media (prefers-reduced-motion:reduce){.panel-h .caret{transition:none}}
#export-body{display:grid;gap:10px;padding-top:8px}
.inp{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line-strong);border-radius:6px;padding:7px 9px;width:100%;min-height:110px;resize:vertical;line-height:1.5}
</style>
</head><body>
<header class="bar">
  <h1 class="marca" data-i18n="title">Site lists</h1>
  <div class="estado">
    <button type="button" class="sello" id="state" aria-expanded="false" aria-controls="dbpanel"></button>
    <span class="lang" role="group" aria-label="Language"><button type="button" id="lang-en" aria-pressed="true">EN</button><button type="button" id="lang-es" aria-pressed="false">ES</button></span>

</header>

<div class="dbpanel" id="dbpanel" hidden>

<div class="shell">

  <main class="work">

    <section class="export" id="export" hidden>
      <button type="button" class="panel-h" id="export-h" aria-expanded="true" aria-controls="export-body"><span class="caret" aria-hidden="true">▾</span><span id="export-t"></span></button>
      <div id="export-body">

</div>

<script type="module">
import { parseList, indexDatabase, matchList, rowForAccept, formatPrice, senderOf, termsOf, priceDelta, listTermsOf, withListTerms, tableToList, NICHES, DB_COLUMNS, BUYING_COLUMN } from "./site-lists.js";
/* ---------- sample database (2026 layout, marked rows are examples) ---------- */
const SAMPLE_DB = [
  r("Publisher","starmagazines.de","starmagazines.de@gmail.com","",{general:"99",casino:"249",cbd:"170",crypto:"170"},"dofollow","Guest post","permanent","Example row: same prices as the 05/10 list"),
  r("Publisher","neuheute.ch","starmagazines.de@gmail.com","",{general:"99",casino:"199",cbd:"150",crypto:"150"},"dofollow","Guest post","permanent","Example row: casino and CBD were cheaper"),
  r("Broker","foxinsider.fr","deals@linkdealers.example","Max",{general:"149",casino:"349"},"dofollow","Guest post","31/12/2026","Example row from a broker"),
  r("Publisher","technologer.de","redaktion@technologer.example","Petra",{general:"99",casino:"449",cbd:"249",crypto:"249"},"dofollow","Guest post","permanent","Example row"),
  r("Publisher","acefootball.com","jof@acefootball.example","Jozef",{casino:"400",general:"300"},"dofollow","Guest post","permanent","Example row"),
  r("Broker","deals-a.example","deals@linkdealers.example","Max",{general:"120"},"dofollow","Link insertion","permanent","Example row"),
  r("Broker","deals-b.example","deals@linkdealers.example","Max",{general:"120"},"dofollow","Link insertion","permanent","Example row"),
  r("Broker","deals-c.example","deals@linkdealers.example","Max",{general:"120"},"dofollow","Link insertion","permanent","Example row")
];
const SAMPLE_REMOVED = [ r("Publisher","esblog.fr","starmagazines.de@gmail.com","",{general:"89"},"dofollow","Guest post","permanent","Example: removed on 20/09, thin content") ];
function r(type, domain, mail, name, buying, tag, link, validity, comment){
  const row = Object.fromEntries(DB_COLUMNS.map(c => [c, ""]));
  row.Type = type; row.Domain = domain; row.TLD = "." + domain.split(".").slice(1).join(".");
  row["Webmaster Contact"] = mail; row["Contact Name"] = name;
  for(const k in buying) row[BUYING_COLUMN[k]] = buying[k];
  row["Sponsor Tag Type"] = tag; row["Link Type"] = link; row["Price Validity"] = validity;
  row["Admin Comments"] = comment; row["Last Updated"] = "05/10/2026";
  return row;
}

const STAR = `Unsere verfügbaren Webseiten und Preise (Allgemein / Glücksspiel / Vape-CBD-Crypto):
neuheute.ch 99 € / 269 € / 180 € · foxinsider.fr 99 / 249 / 170 · esblog.fr 89 / 249 / 170 · elitethemen.de 99 / 249 / 170 · starmagazines.de 99 € / 249 € / 170 € · glanzinsider.de 88 / 249 / 170 · klarnotizen.de 89 / 239 / 160 · tagespromi.de 99 / 269 / 180 · kuriermag.de 95 / 249 / 170 · denkmagazine.de 88 / 239 / 160 · blinkinsider.de 99 / 259 / 180 · promiquelle.de 95 / 269 / 180 · weltblicker.de 88 / 239 / 160 · neuzone.de 99 / 259 / 170 · neuewissen.de 89 / 249 / 160 · blickreport.de 95 / 269 / 180 · technologer.de 99 / 449 / 249 · insidermag.de 99 / 449 / 249 · tageblatts.de 99 / 400 / 200 · heuteinsider.de 99 / 349 / 249 · gmweekly.de 99 / 349 / 220 · publikneues.de 99 / 349 / 170 · jetmagazin.de 99 / 249 / 170 · smartmaga.de 99 / 249 / 170 · heutenetz.de 99 / 249 / 170 · reportmagazin.de 99 / 249 / 170 · pressradar.de 99 / 249 / 170 · visionmagazines.de 99 / 249 / 170 · lebenreport.de 99 / 249 / 170 · flashtimes.de 99 / 249 / 170 · themenkern.de 99 / 249 / 170 · fokusprime.de 99 / 249 / 170 · biowissen.at 99 / 400 / 200

Unsere Leistungen: Dauerhafte Veröffentlichung von Gastbeiträgen · Do-Follow-Links · Verschiedene Nischen, darunter Krypto, Gambling, CBD und Vape`;

/* ---------- state ---------- */
let dbRows = SAMPLE_DB, rmRows = SAMPLE_REMOVED, dbSource = "sample rows";
let index = indexDatabase(dbRows, rmRows);
let groups = null, items = [], lastParsed = null, view = "changed", stype = "Publisher";
try{ stype = localStorage.getItem("ljc-lists-stype") === "Broker" ? "Broker" : "Publisher"; }catch(e){}
function setStype(v){
  stype = v; try{ localStorage.setItem("ljc-lists-stype", v); }catch(e){}
  $("stype-publisher").className = v === "Publisher" ? "on-type" : "";
  $("stype-broker").className = v === "Broker" ? "on-type" : "";
  if(groups) render();
}

function noteParse(){
  if(!lastParsed) return;
  const cols = lastParsed.columns ? lastParsed.columns.filter(Boolean).join(", ") : t().noheader;
  $("parsenote").textContent = t().parsed(items.length, lastParsed.skipped.length, cols);
}

/* ---------- CSV ---------- */
function csvToObjects(text){
  const lines = text.replace(/\r/g, "").split("\n");
  const rows = []; let cur = []; let cell = ""; let q = false; let head = null;
  for(const line of lines){
    for(let i = 0; i < line.length; i++){
      const ch = line[i];
      if(ch === '"'){ if(q && line[i + 1] === '"'){ cell += '"'; i++; } else q = !q; }
      else if(ch === "," && !q){ cur.push(cell); cell = ""; }
      else cell += ch;
    }
    if(q){ cell += "\n"; continue; }
    cur.push(cell); cell = "";
    if(!head) head = cur.map(h => h.trim()); else if(cur.length > 1) rows.push(Object.fromEntries(head.map((h, j) => [h, cur[j] ?? ""])));
    cur = [];
  }
  return rows;
}
function readFile(input, cb){
  const f = input.files && input.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => cb(String(rd.result || ""), f.name);
  rd.readAsText(f);
}

/* ---------- matching ---------- */
function run(){
  const parsed = parseList($("list").value);
  const listTerms = listTermsOf(parsed);
  items = parsed.items.map(i => withListTerms(i, listTerms)); lastParsed = parsed;
  noteParse();
  for(const k in decisions) delete decisions[k];
  loadDecisions();
  groups = matchList(items, index, { sender: $("sender").value });
  render();
}
$("match").addEventListener("click", run);

function price(p){ return p ? formatPrice(p) : ""; }
function offeredCells(item, diffs){
  const deltas = new Map();
  (diffs || []).forEach(list => priceDelta(list).forEach(d => { if(!deltas.has(d.niche)) deltas.set(d.niche, d); }));
  return NICHES.filter(n => item.prices[n]).map(n => {
    const d = deltas.get(n);
    let tail = "";
    if(d && d.delta != null && d.delta !== 0) tail = `<span class="delta ${d.delta > 0 ? "up" : "down"}">${d.delta > 0 ? "+" : "−"}${esc(formatPrice({ amount: Math.abs(d.delta) }))} · ${Math.abs(d.pct)}% ${d.delta > 0 ? t().dAbove : t().dBelow}</span>`;
    else if(d && d.inDatabase == null) tail = `<span class="delta up">${t().recorded}: —</span>`;
    return `<span class="pr${d ? " cambia" : ""}"><span class="k">${esc(t().niche[n])}</span>${esc(price(item.prices[n]))}${tail}</span>`;
  }).join("") || `<span class="sender">${t().noPrice}</span>`;
}
function termsCells(item){
  const f = termsOf(item);
  const chips = [["linkType", f.linkType], ["placement", f.placement], ["priceValidity", f.priceValidity], ["sponsorTag", f.sponsorTag]]
    .map(([k, v]) => v ? `<span class="fv" title="${esc(t().terms[k])}">${esc(v)}</span>` : "").join("");
  const admin = f.adminComments.map(c => `<span class="fv off">${esc(c)}</span>`).join("");
  const raw = !item.terms ? "" : item.inherited
    ? `<span class="fv off" title="${esc(t().fromList)}: ${esc(item.terms)}">${esc(t().fromListShort)}</span>`
    : `${item.inheritedPartly ? `<span class="fv off" title="${esc(t().fromList)}">${esc(t().fromListShort)}</span>` : ""}<span class="raw">${esc(item.terms.split(" | ").slice(0, 2).join(" | "))}</span>`;
  return (chips || admin) ? chips + admin + raw : (item.terms ? raw : `<span class="sender">${t().saidNothing}</span>`);
}
function dbCells(rows){
  if(!rows.length) return `<span class="sender">${t().notInDb}</span>`;
  return rows.map(row => {
    const ps = NICHES.filter(n => row[BUYING_COLUMN[n]]).map(n => `<span class="pr"><span class="k">${esc(t().niche[n])}</span>${esc(row[BUYING_COLUMN[n]])}</span>`).join("") || `<span class="sender">${t().noPrice}</span>`;
    const type = String(row.Type || "").trim();
    return `<div class="dbrow"><span class="sender">${type ? `<span class="tipo ${type.toLowerCase() === "broker" ? "broker" : ""}">${esc(type)}</span>` : ""}${esc(senderOf(row) || t().noContact)} · ${esc(row["Last Updated"] || "")}</span>${ps}</div>`;
  }).join("");
}
function decisionCell(domain){
  const d = decisions[domain];
  const keys = stype === "Broker" ? ["webmaster","accept","ask","reject"] : ["accept","webmaster","ask","reject"];
  return `<span class="seg">` + keys.map(k => `<button type="button" data-dom="${esc(domain)}" data-dec="${k}" class="${d === k ? "on-" + k : ""}">${t()[k]}</button>`).join("") + `</span>`;
}
function table(entries, kind){
  if(!entries.length) return `<div class="tabla-wrap"><div class="empty">${t().empty}</div></div>`;
  const rows = entries.map(e => {
    const d = e.item.domain; const done = decisions[d] ? " done" : "";
    const dbCol = e.removedRows ? dbCells(e.removedRows) : dbCells(e.rows);
    return `<tr class="${done.trim()}"><td class="dom">${esc(d)}${e.item.path ? `<span class="sender">${esc(e.item.path)}</span>` : ""}</td><td>${offeredCells(e.item, e.diffs)}</td><td>${dbCol}</td><td class="ancha">${termsCells(e.item)}</td><td class="dec">${decisionCell(d)}</td></tr>`;
  }).join("");
  return `<div class="tabla-wrap"><table class="outreach"><thead><tr><th>${t().thDomain}</th><th>${t().thOffered}</th><th>${kind === "removed" ? t().thRemoved : t().thDb}</th><th>${t().thTerms}</th><th>${t().thDecision}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function render(){
  if(!groups) return;
  const total = items.length, decided = Object.keys(decisions).filter(k => items.some(i => i.domain === k)).length;
  const first = groups.unknown.concat(groups.changed, groups.unchanged, groups.removed)[0];
  const broker = stype === "Broker" ? `<div class="aviso acc">${t().brokerHint}</div>` : (first && first.brokerHint ? `<div class="aviso">${t().broker(first.brokerHint)}</div>` : "");
  const sameSender = groups.changed.filter(c => c.sameSender).length;
  const all = groups.changed.concat(groups.unknown, groups.unchanged, groups.removed);
  const tabs = [
    ["changed", "wait", t().gChanged, groups.changed, t().hChanged],
    ["unknown", "", t().gUnknown, groups.unknown, t().hUnknown],
    ["unchanged", "ok", t().gUnchanged, groups.unchanged, t().hUnchanged],
    ["removed", "", t().gRemoved, groups.removed, t().hRemoved],
    ["all", "", t().all, all, ""]
  ];
  if(!tabs.find(x => x[0] === view)) view = "changed";
  const cur = tabs.find(x => x[0] === view);
  $("results").innerHTML = `
    <div class="gtabs" role="tablist">
      ${tabs.map(([k, cls, label, arr]) => `<button type="button" role="tab" class="gtab ${cls}" data-view="${k}" aria-selected="${k === view}">${label} <span class="n">${arr.length}</span></button>`).join("")}
      <span class="progreso">${t().decided(decided, total)} <i><b style="width:${total ? Math.round(decided / total * 100) : 0}%"></b></i></span>
    </div>
    ${broker}
    ${cur[4] ? `<p class="ghint">${cur[4]}${view === "changed" && sameSender ? ` ${sameSender} ${t().fromSender}.` : ""}</p>` : ""}
    ${table(cur[3], view === "removed" ? "removed" : view)}`;
  $("results").querySelectorAll(".gtab").forEach(b => b.addEventListener("click", () => { view = b.dataset.view; render(); }));
  $("results").querySelectorAll("button[data-dec]").forEach(b => b.addEventListener("click", () => {
    const dom = b.dataset.dom, dec = b.dataset.dec;
    if(decisions[dom] === dec) delete decisions[dom]; else decisions[dom] = dec;
    saveDecisions(); render();
  }));
  renderExport();
}
function renderExport(){
  const accepted = items.filter(i => decisions[i.domain] === "accept");
  const label = $("label").value.trim();
  const sender = $("sender").value.trim();
  $("export").hidden = !accepted.length;
  if(accepted.length){
    $("export-t").textContent = t().exportT(accepted.length);
    const rows = accepted.map(i => rowForAccept(i, { type: stype, sender, who: "you", listLabel: label }));
    const show = ["Type", "Domain", "Webmaster Contact", ...NICHES.map(n => BUYING_COLUMN[n]), "Sponsor Tag Type", "Link Type", "Placement", "Price Validity", "Admin Comments", "Last Updated"];
    const used = show.filter(c => c === "Type" || c === "Domain" || rows.some(r => r[c]));
    $("export-prev").innerHTML = `<table class="outreach"><thead><tr>${used.map(c => `<th>${esc(c.replace("Buying ", "B. "))}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${used.map(c => `<td class="${c === "Domain" ? "dom" : ""}">${esc(r[c]).replace(/\n/g, "<br>")}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    $("tsv").value = [DB_COLUMNS.join("\t")].concat(rows.map(r => DB_COLUMNS.map(c => String(r[c]).replace(/\t|\n/g, " ")).join("\t"))).join("\n");
  }
  const wm = items.filter(i => decisions[i.domain] === "webmaster");
  $("wm").hidden = !wm.length;
  if(wm.length){
    $("wm-t").textContent = t().wmT(wm.length);
    const cols = ["Domain", "Country", "Date Sent", "Whatsapp / Phone Number", "Status WA / Number", "Contact Email", "Alternative contact", "Replied?", "Database?", "Additional Comments"];
    const rows = wm.map(i => {
      const offered = NICHES.filter(n => i.prices[n]).map(n => `${t().niche[n]} ${formatPrice(i.prices[n])}`).join(", ");
      return { Domain: i.domain, Country: "", "Date Sent": "", "Whatsapp / Phone Number": "", "Status WA / Number": "", "Contact Email": "", "Alternative contact": "", "Replied?": "FALSE", "Database?": "FALSE",
        "Additional Comments": `${stype} ${sender} offered ${offered || "no price"}${label ? ` (list ${label})` : ""}${i.terms ? `; ${i.terms}` : ""}` };
    });
    const used = ["Domain", "Contact Email", "Additional Comments"];
    $("wm-prev").innerHTML = `<table class="outreach"><thead><tr>${used.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${used.map(c => `<td class="${c === "Domain" ? "dom" : ""}">${esc(r[c]) || "<span class=sender>—</span>"}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    $("wm-tsv").value = [cols.join("\t")].concat(rows.map(r => cols.map(c => String(r[c]).replace(/\t|\n/g, " ")).join("\t"))).join("\n");
  }
}
function copyFrom(id, note){
  const el = $(id); const txt = el.value;
  const done = () => { $(note).textContent = t().copied; setTimeout(() => { $(note).textContent = ""; }, 1500); };
  const fallback = () => { el.hidden = false; el.select(); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
}
$("wm-copy").addEventListener("click", () => copyFrom("wm-tsv", "wm-note"));

/* ---------- the file they sent ---------- */
/* SheetJS is loaded only when an Excel file arrives, from cdnjs (the only
   script host the page may use), pinned. CSV and text need nothing. */
const SHEETJS = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
let sheetjs = null;
function loadSheetJS(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(sheetjs) return sheetjs;
  sheetjs = new Promise((ok, no) => {
    const s = document.createElement("script"); s.src = SHEETJS; s.async = true;
    s.onload = () => window.XLSX ? ok(window.XLSX) : no(new Error("no XLSX"));
    s.onerror = () => { sheetjs = null; no(new Error("load failed")); };
    document.head.appendChild(s);
  });
  return sheetjs;
}
$("listfile").addEventListener("change", async () => {
  const f = $("listfile").files && $("listfile").files[0]; if(!f) return;
  $("filenote").textContent = t().fileLoading;
  try{
    if(/\.(xlsx|xls|xlsm|ods)$/i.test(f.name)){
      const XLSX = await loadSheetJS();
      const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
      const parts = wb.SheetNames.map(n => tableToList(XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: "" }))).filter(Boolean);
      $("list").value = parts.join("\n\n");
      $("filenote").textContent = t().fileRead(f.name, wb.SheetNames.length);
    }else{
      $("list").value = await f.text();
      $("filenote").textContent = t().fileText(f.name);
    }
    if(!$("label").value.trim()) $("label").value = f.name.replace(/\.[^.]+$/, "");
    run();
  }catch(e){
    $("filenote").textContent = t().fileFail;
  }
});
