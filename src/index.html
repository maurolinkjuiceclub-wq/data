<title>LJC Site Lists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Same system as the desk (src/mesa.html): dark by default in neutral greys, a surface scale instead of borders, one blue accent; green and amber mean state, never decoration. Layout: the desk's bar on top, then a full-width work screen like "Our outreach". */
:root{
  --paper:#161616; --surface:#1e1e1e; --surface-2:#252525; --surface-3:#2f2f2f;
  --ink:#ededed; --ink-2:#b9b9b9; --muted:#8d8d8d; --line:#2c2c2c; --line-strong:#414141;
  --accent:#6ea8fe; --accent-ink:#9cc4ff; --accent-wash:#1c2534;
  --ok-bg:#16301f; --ok-ink:#7fd39b; --ok-line:#3f8a58;
  --wait-bg:#33260f; --wait-ink:#e8b565; --wait-line:#9a7a3a;
  --bad:#e0645b; --bad-ink:#f08a82; --bad-bg:#3a1f1d; --bad-line:#6e3531;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px -16px rgba(0,0,0,.9);
  --radio:8px;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]){
  --paper:#f6f6f6; --surface:#ffffff; --surface-2:#efefef; --surface-3:#e4e4e4;
  --ink:#161616; --ink-2:#3d3d3d; --muted:#6b6b6b; --line:#e3e3e3; --line-strong:#cbcbcb;
  --accent:#1f5fd0; --accent-ink:#164aa6; --accent-wash:#e9effb;
  --ok-bg:#ddf2e4; --ok-ink:#1a6b3c; --ok-line:#a6dcba;
  --wait-bg:#fcecd4; --wait-ink:#8a5000; --wait-line:#eecb94;
  --bad:#c0392b; --bad-ink:#b3261e; --bad-bg:#fbe5e2; --bad-line:#eeb3ab;
  --shadow:0 1px 2px rgba(16,24,40,.04); color-scheme:light } }
:root[data-theme="light"]{
  --paper:#f6f6f6; --surface:#ffffff; --surface-2:#efefef; --surface-3:#e4e4e4;
  --ink:#161616; --ink-2:#3d3d3d; --muted:#6b6b6b; --line:#e3e3e3; --line-strong:#cbcbcb;
  --accent:#1f5fd0; --accent-ink:#164aa6; --accent-wash:#e9effb;
  --ok-bg:#ddf2e4; --ok-ink:#1a6b3c; --ok-line:#a6dcba;
  --wait-bg:#fcecd4; --wait-ink:#8a5000; --wait-line:#eecb94;
  --bad:#c0392b; --bad-ink:#b3261e; --bad-bg:#fbe5e2; --bad-line:#eeb3ab;
  --shadow:0 1px 2px rgba(16,24,40,.04); color-scheme:light }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---------- the bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:0 16px;min-height:46px;background:var(--surface);border-bottom:1px solid var(--line)}
.marca{font-weight:600;font-size:14px;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;margin:0}
.estado{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 0;font-size:12px;color:var(--muted)}
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.lang button{background:var(--surface);border:0;padding:3px 8px;cursor:pointer;font-size:10.5px;letter-spacing:.05em;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.sello{font-family:var(--mono);font-size:11px;color:var(--muted);background:none;border:1px solid transparent;border-radius:6px;padding:3px 7px;white-space:nowrap}

/* ---------- database panel, behind its seal ---------- */
.sello{cursor:pointer}
.sello:hover,.sello[aria-expanded="true"]{border-color:var(--line-strong);color:var(--ink)}
.dbpanel{background:var(--surface);border-bottom:1px solid var(--line)}
.dbpanel-in{display:grid;gap:12px;padding:14px 16px;max-width:980px}
@media (min-width:720px){.dbpanel-in{padding:14px 24px}}
.lbl,.rev-form label,.dbpanel label{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.par{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr))}
input[type=file]{font-size:12.5px;color:var(--ink-2);max-width:100%}
.dbmeta{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere;margin-right:auto}

/* ---------- shell: the list on a rail, the work beside it ---------- */
.shell{display:grid;grid-template-columns:minmax(0,1fr);gap:0;min-height:calc(100vh - 46px)}
@media (min-width:900px){.shell{grid-template-columns:360px minmax(0,1fr)}}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:16px}
.work{padding:16px;min-width:0}
@media (min-width:720px){.rail{padding:18px 20px}.work{padding:18px 24px 60px}}
.rev-form{display:grid;gap:12px;margin:0;align-content:start;min-width:0}
.rev-form input[type=text],.rev-form textarea{width:100%;padding:7px 9px;border-radius:7px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);font:inherit;font-size:13px}
.rev-form textarea{min-height:260px;resize:vertical;font-family:var(--mono);font-size:12px;line-height:1.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
.btn.primary:hover{filter:brightness(1.08);color:var(--surface);border-color:var(--accent)}
.btn.sutil{border-color:transparent;background:none;color:var(--muted);font-size:12.5px;padding:8px 8px}
.btn.sutil:hover{color:var(--accent-ink);border-color:var(--line-strong)}
.said{font-size:12.5px;color:var(--muted);margin:0}

/* ---------- the work: one table, group tabs above it ---------- */
.gtabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);padding-bottom:0;margin-bottom:12px}
.gtab{background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.gtab:hover{color:var(--ink)}
.gtab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.gtab .n{font-family:var(--mono);font-size:10.5px;font-variant-numeric:tabular-nums;border-radius:20px;padding:1px 6px;min-width:18px;text-align:center;background:var(--surface-3);color:var(--ink-2)}
.gtab[aria-selected="true"] .n{background:var(--accent);color:var(--surface)}
.gtab.ok .n{background:var(--ok-bg);color:var(--ok-ink)}
.gtab.wait .n{background:var(--wait-bg);color:var(--wait-ink)}
.gtab[aria-selected="true"].ok .n,.gtab[aria-selected="true"].wait .n{background:var(--accent);color:var(--surface)}
.progreso{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);padding:6px 0;font-variant-numeric:tabular-nums}
.progreso i{display:block;width:96px;height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.progreso i b{display:block;height:100%;background:var(--accent);width:0}
@media (prefers-reduced-motion:no-preference){.progreso i b{transition:width .2s}}
.aviso{border:1px solid var(--wait-line);background:var(--wait-bg);color:var(--wait-ink);border-radius:7px;padding:8px 12px;margin:0 0 12px;font-size:12.5px}
.ghint{font-size:12px;color:var(--muted);margin:0 0 8px}
.tabla-wrap{overflow-x:auto;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);box-shadow:var(--shadow)}
table.outreach{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%}
table.outreach th,table.outreach td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
table.outreach thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);border-bottom:1px solid var(--line-strong);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
table.outreach td{font-family:var(--mono);font-variant-numeric:tabular-nums}
table.outreach td.dom{font-weight:600;font-size:13px}
.domlink{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline dotted var(--line-strong);text-underline-offset:3px}
.domlink:hover{color:var(--accent-ink);text-decoration-color:var(--accent)}
table.outreach td.ancha{white-space:normal;min-width:120px;max-width:240px;width:18%;font-family:var(--sans);font-size:12.5px;color:var(--ink-2)}
table.outreach tbody tr:hover td{background:var(--accent-wash)}
table.outreach tbody tr:last-child td{border-bottom:0}
table.outreach tr.done td{opacity:.55}
table.outreach tr.done td.dec,table.outreach tr.done td.dom{opacity:1}
table.outreach tr.done td.dom{color:var(--muted)}
.pr{display:block;font-size:12px;line-height:1.6}
.pr.cambia{color:var(--ok-ink);font-weight:600}
.pr .k{display:inline-block;min-width:5.2em;color:var(--muted);font-weight:400}
.sender{display:block;font-size:10.5px;color:var(--muted);font-family:var(--sans);line-height:1.5;white-space:normal;max-width:260px}
.tipo{display:inline-block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;border:1px solid var(--line-strong);border-radius:4px;padding:0 4px;margin-right:5px;color:var(--ink-2);font-family:var(--sans)}
.tipo.broker{border-color:var(--wait-line);color:var(--wait-ink)}
.dbrow+.dbrow{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line-strong)}
td.dec{white-space:nowrap;width:1%;vertical-align:top}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{background:var(--surface);border:0;border-right:1px solid var(--line-strong);padding:5px 10px;font-size:12px;cursor:pointer;color:var(--ink-2);font-family:var(--sans);white-space:nowrap}
.seg button:last-child{border-right:0}
/* Four decisions in a 2 by 2 block, so the column stays narrow. */
td.dec .seg{display:inline-grid;grid-template-columns:1fr 1fr}
td.dec .seg button{border-right:0;border-bottom:1px solid var(--line-strong);border-left:1px solid var(--line-strong);text-align:left}
td.dec .seg button:nth-child(odd){border-left:0}
td.dec .seg button:nth-child(n+3){border-bottom:0}
.seg button:hover{color:var(--ink);background:var(--surface-2)}
.seg .on-accept{background:var(--ok-bg);color:var(--ok-ink);font-weight:600}
.seg .on-reject{background:var(--bad-bg);color:var(--bad-ink);font-weight:600}
.seg .on-ask{background:var(--wait-bg);color:var(--wait-ink);font-weight:600}
.empty{color:var(--muted);font-style:italic;padding:14px 12px;font-size:13px}
.seg .on-type{background:var(--accent-wash);color:var(--accent-ink);font-weight:600}
.seg.stype button{padding:6px 12px;font-size:12.5px}
.seg .on-webmaster{background:var(--accent-wash);color:var(--accent-ink);font-weight:600}
.delta{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.delta.up{color:var(--wait-ink)}
.delta.down{color:var(--ok-ink)}
.fv{display:inline-block;font-family:var(--sans);font-size:11px;border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;margin:0 4px 3px 0;color:var(--ink-2);background:var(--surface-2)}
.fv.off{border-style:dashed;color:var(--muted);background:none}
.raw{display:block;font-size:11px;color:var(--muted);margin-top:2px;white-space:normal}
.export table.outreach td{white-space:normal}
.export table.outreach td.dom{white-space:nowrap}
.aviso.acc{border-color:var(--accent);background:var(--accent-wash);color:var(--accent-ink)}

/* ---------- the database screen ---------- */
.modes{margin-left:6px}
.modes button{padding:4px 12px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.modes button[aria-selected="true"]{background:var(--accent-wash);color:var(--accent-ink);font-weight:600}
.modes .n{font-family:var(--mono);font-size:10px;font-variant-numeric:tabular-nums;background:var(--surface-3);color:var(--ink-2);border-radius:20px;padding:0 6px}
.modes .n:empty{display:none}
.dbscreen{display:grid;grid-template-rows:auto minmax(0,1fr);height:calc(100vh - 46px)}
.dbmain{position:relative;min-height:0;display:grid;grid-template-rows:minmax(0,1fr)}
.dbtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
@media (min-width:720px){.dbtools{padding:12px 24px}}
.dbq{flex:1 1 220px;min-width:0;padding:7px 10px;border-radius:7px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);font:inherit;font-size:13px}
.dbtools select{padding:6px 8px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;max-width:200px}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.dbgrid{overflow:auto;min-height:0}
.dbhead,.dbr{display:grid;grid-template-columns:var(--cols);align-items:center;min-width:max-content}
.dbhead{position:sticky;top:0;z-index:2;background:var(--surface-2);border-bottom:1px solid var(--line-strong);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dbhead > div,.dbr > div{padding:0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;height:34px;line-height:34px;border-right:1px solid var(--line)}
.dbhead > div:last-child,.dbr > div:last-child{border-right:0}
.dbr{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line);cursor:pointer}
.dbr:hover{background:var(--accent-wash)}
.dbr.sel{background:var(--accent-wash);box-shadow:inset 3px 0 0 var(--accent)}
.dbr .d{font-weight:600;font-size:12.5px}
.dbr .s{font-family:var(--sans);color:var(--ink-2)}
.dbr .num{text-align:right;color:var(--ink-2)}
.dbr .num.has{color:var(--ink)}
.dbr .mut{color:var(--muted)}
.dbr .tipo{vertical-align:middle;line-height:1.4}
.dbspacer{width:1px}
.dbempty{padding:28px 16px;color:var(--muted);font-style:italic}
.dbloading{opacity:.5}
.dbdetail{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line-strong);box-shadow:var(--shadow);overflow:auto;padding:14px 18px 30px;z-index:5}
.dbdetail-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font-family:var(--mono)}
.dbdetail dl{margin:0;display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr);gap:4px 12px;font-size:12.5px}
.dbdetail dt{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.dbdetail dd{margin:0;font-family:var(--mono);overflow-wrap:anywhere;white-space:pre-wrap}
.dbdetail dd.e{color:var(--line-strong)}
@media (max-width:719px){.dbhead > div,.dbr > div{padding:0 8px}}

/* ---------- export, folded ---------- */
.export{margin-top:22px;border-top:1px solid var(--line);padding-top:10px}
.panel-h{width:100%;display:flex;align-items:center;gap:8px;background:transparent;border:0;cursor:pointer;padding:6px 2px;text-align:left;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.panel-h:hover{color:var(--ink)}
.panel-h .caret{font-size:9px;transition:transform .15s}
.panel-h[aria-expanded="false"] .caret{transform:rotate(-90deg)}
@media (prefers-reduced-motion:reduce){.panel-h .caret{transition:none}}
#export-body{display:grid;gap:10px;padding-top:8px}
.inp{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line-strong);border-radius:6px;padding:7px 9px;width:100%;min-height:110px;resize:vertical;line-height:1.5}
</style>
</head><body>
<header class="bar">
  <h1 class="marca" data-i18n="title">Site lists</h1>
  <span class="seg modes" role="tablist" aria-label="Screen"><button type="button" id="mode-list" role="tab" aria-selected="true" data-i18n="modeList">List</button><button type="button" id="mode-db" role="tab" aria-selected="false"><span data-i18n="modeDb">Database</span> <span class="n" id="mode-db-n"></span></button></span>
  <div class="estado">
    <button type="button" class="sello" id="state" aria-expanded="false" aria-controls="dbpanel"></button>
    <span class="lang" role="group" aria-label="Language"><button type="button" id="lang-en" aria-pressed="true">EN</button><button type="button" id="lang-es" aria-pressed="false">ES</button></span>
  </div>
</header>

<div class="dbpanel" id="dbpanel" hidden>
  <div class="dbpanel-in">
    <div><span class="lbl" data-i18n="db">Database</span><p class="hint" data-i18n="dbhint"></p></div>
    <div class="par">
      <div><label for="dbfile" data-i18n="dbfileL">Copy of the sheet · .xlsx (both tabs) or .csv</label><input type="file" id="dbfile" accept=".xlsx,.xls,.xlsm,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv"></div>
      <div><label for="rmfile" data-i18n="rmfileL">removed sites · .csv, when the copy is a CSV</label><input type="file" id="rmfile" accept=".csv,text/csv"></div>
    </div>
    <p class="hint" data-i18n="dbnever">This page never writes to the database. Accept builds the rows; a person pastes them into the sheet.</p>
    <div class="actions"><span class="dbmeta" id="dbmeta"></span><button type="button" class="btn sutil" id="reset" data-i18n="reset"></button></div>
  </div>
</div>

<div class="shell" id="screen-list">
  <aside class="rail">
    <form class="rev-form" onsubmit="return false">
      <div><label for="sender" data-i18n="sender">Sender</label><input type="text" id="sender" value="redaktion@sternmagazin.example" autocomplete="off"></div>
      <div><label data-i18n="stype">The sender is</label><span class="seg stype" role="group"><button type="button" id="stype-publisher" data-stype="Publisher" class="on-type" data-i18n="typePublisher">Publisher</button><button type="button" id="stype-broker" data-stype="Broker" data-i18n="typeBroker">Broker</button></span></div>
      <div><label for="label" data-i18n="list">List</label><input type="text" id="label" value="example list 05/10" autocomplete="off"></div>
      <div><label for="list" data-i18n="paste">Paste the list</label><textarea id="list" spellcheck="false"></textarea></div>
      <div><label for="listfile" data-i18n="orfile">or load the file they sent</label><input type="file" id="listfile" accept=".xlsx,.xls,.csv,.txt,.tsv,.pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv,text/plain,application/pdf"><p class="said" id="filenote"></p></div>
      <div class="actions"><button type="button" class="btn primary" id="match" data-i18n="match">Match</button></div>
      <p class="said" id="parsenote"></p>
    </form>
  </aside>

  <main class="work">
    <div id="results"></div>
    <section class="export" id="export" hidden>
      <button type="button" class="panel-h" id="export-h" aria-expanded="true" aria-controls="export-body"><span class="caret" aria-hidden="true">▾</span><span id="export-t"></span></button>
      <div id="export-body">
        <p class="hint" data-i18n="rowshint"></p>
        <div class="tabla-wrap" id="export-prev"></div>
        <div class="actions"><button type="button" class="btn" id="copy" data-i18n="copy">Copy</button><span class="said" id="copynote"></span></div>
        <textarea id="tsv" class="inp" readonly spellcheck="false" hidden></textarea>
      </div>
    </section>
    <section class="export" id="wm" hidden>
      <button type="button" class="panel-h" id="wm-h" aria-expanded="true" aria-controls="wm-body"><span class="caret" aria-hidden="true">▾</span><span id="wm-t"></span></button>
      <div id="wm-body">
        <p class="hint" data-i18n="wmhint"></p>

<script>
/* Site lists: parse what a publisher or broker sends, match it against the
   database, group the result. Plain ES module, no DOM, no network: the Worker
   imports it to answer lookups and the desk inlines it for the Lists tab.
   Tests: node scripts/probar-listas.mjs

   Vocabulary (BRIEF.md):
   - an OFFER is the buying price per niche plus terms; the sell price is not
     touched here;
   - the DATABASE is the "Import Database" tab, one row per domain, plus the
     "removed sites" tab, which is an exclusion list;
   - matching is by normalised domain; several senders for one domain is the
     normal case. */

/* ---------- domains ---------- */

/* Registrable domain of whatever a person pasted: a URL, "www.x.com/path",
   "X.COM", "x.com/es" (the Latam copy keeps language paths; they are kept as
   `path` and dropped from `domain`). Returns null when it is not a domain. */
function normaliseDomain(raw){
  if(raw == null) return null;
  let s = String(raw).trim().toLowerCase();
  if(!s) return null;
  s = s.replace(/\s*\([^()]*\)\s*$/, "");   /* "rfi.ro (rfi.fr/ro)" */
  s = s.replace(/^[\s"'<(\[]+|[\s"'>)\]:;,.]+$/g, "");
  s = s.replace(/^(?:https?:)?\/\//, "");
  s = s.replace(/^www\d?\./, "");
  /* A path starts at "/", "?" or "#". Whitespace means this is prose, not a
     domain ("b.com - 300 EUR"). */
  const cut = s.search(/[\/?#]/);
  let path = "";
  if(cut >= 0){ path = s.slice(cut); s = s.slice(0, cut); }
  if(/\s/.test(s)) return null;
  s = s.replace(/:\d+$/, "");
  if(s.startsWith("mailto:") || s.includes("@")) return null;
  if(!/^[\p{L}\p{N}][\p{L}\p{N}.-]*\.[\p{L}]{2,}$/u.test(s)) return null;
  if(s.includes("..")) return null;
  return { domain: s, path: path.replace(/\/+$/, "") };
}

/* ---------- prices ---------- */

const CURRENCY = { "€": "EUR", "eur": "EUR", "euro": "EUR", "euros": "EUR", "$": "USD", "usd": "USD", "£": "GBP", "gbp": "GBP" };

/* "€ 400.00", "€ 9,999.99", "€ 99,99", "$999.99", "400€", "EUR 400",
   "400 eur", "1.200,00 €". Returns {amount, currency, text} or null.
   The currency defaults to EUR only when a bare number is given, because
   Gary (06/10) says every price in the database is EUR. */
function parsePrice(raw){
  if(raw == null) return null;
  const text = String(raw).trim();
  if(!text) return null;
  const m = text.match(/(€|\$|£|\beur(?:os?)?\b|\busd\b|\bgbp\b)?\s*(\d[\d.,\s]*\d|\d)\s*(€|\$|£|\beur(?:os?)?\b|\busd\b|\bgbp\b)?/i);
  if(!m) return null;
  const cur = CURRENCY[(m[1] || m[3] || "").toLowerCase()] || "EUR";
  let num = m[2].replace(/\s/g, "");
  /* Decide which separator is decimal: the last one, if followed by exactly
     two digits; otherwise all separators are thousands. */
  const last = Math.max(num.lastIndexOf(","), num.lastIndexOf("."));
  if(last >= 0 && num.length - last - 1 === 2){
    num = num.slice(0, last).replace(/[.,]/g, "") + "." + num.slice(last + 1);
  }else{
    num = num.replace(/[.,]/g, "");
  }
  const amount = Number(num);
  if(!isFinite(amount)) return null;
  return { amount, currency: cur, text };
}

/* True when the cell is a price and nothing else: "€ 400.00", "400 eur",
   "1.200,00 €". "Prices valid until 31.12.2026" or "DR 45" are not. */
function isPriceCell(raw){
  const text = String(raw || "").trim();
  if(!text || !parsePrice(text)) return false;
  const rest = text.replace(/€|\$|£|\beur(?:os?)?\b|\busd\b|\bgbp\b/gi, "").replace(/[\d.,\s]/g, "");
  return rest === "";
}

/* A price anywhere in a sentence, when the currency is next to the number:
   "35 EUR + TVA", "costs € 400 per article", "100€/post". Null when the
   line only has bare numbers (a bare number in prose is rarely a price). */
function findPrice(line){
  const m = String(line || "").match(/(€|\$|£|\beur(?:os?)?\b|\busd\b|\bgbp\b)\s*(\d[\d.,]*\d|\d)|(\d[\d.,]*\d|\d)\s*(€|\$|£|\beur(?:os?)?\b|\busd\b|\bgbp\b)/i);
  if(!m) return null;
  const p = parsePrice(m[0]);
  return p ? { ...p, text: m[0] } : null;
}

/* ---------- niches ---------- */

/* The seven Buying columns of the database, and the words lists use for them. */
const NICHES = ["casino", "unlicensedCasino", "crypto", "forex", "cbd", "dating", "general"];
const GREY = /gr[ae]y[ -]?(niches?|markets?|hat)/i;
const NICHE_WORDS = [
  ["unlicensedCasino", /unlicen[cs]ed|sin licencia|offshore|curacao/i],
  ["casino", /casino|gambling|gl[üu]cksspiel|betting|wetten|apuestas|igaming|poker|slots?|juego/i],
  ["crypto", /crypto|cripto|krypto|bitcoin|blockchain/i],
  ["forex", /forex|trading|finance|finanzen|finanzas/i],
  ["cbd", /\bcbd\b|cannabis|hemp|vape|hanf/i],
  ["dating", /dating|adult|citas/i],
  ["general", /general|allgemein|mainstream|normal|standard|regular|price|precio|preis|cost|article|artikel|articol|guest ?post|gastbeitrag|advertorial/i],
  /* "Gambling & Grey Niches" (MM Group Media, 09/10): grey is everything
     that is not mainstream, so the price fills the four grey columns too. */
  ["crypto", GREY], ["forex", GREY], ["cbd", GREY], ["dating", GREY]
];
/* A column for a product that is not an article carries no Buying price:
   link insertions, brand mentions, banners, niche edits. Its cells stay as
   labelled terms so the person still sees them. */
const NOT_ARTICLE = /link\s*insert|insertion|brand\s*mention|banner|niche\s*edit|homepage|sidebar|press\s*release|social/i;
function nicheOf(header){
  return nichesOf(header)[0] || null;
}
/* Every niche a header names, in the order they appear: "Vape-CBD-Crypto"
   is [cbd, crypto] and a price under it fills both Buying columns. */
function nichesOf(header){
  const h = String(header || "");
  if(NOT_ARTICLE.test(h)) return [];
  const found = NICHE_WORDS.map(([niche, re]) => { const m = re.exec(h); return m ? [m.index, niche] : null; })
    .filter(Boolean).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  const once = found.filter((n, i) => found.indexOf(n) === i);
  /* "PRICE / ARTICLE Advertorial (GAMBLING)" is casino, not casino and
     general: the general words only count when no niche is named. */
  const specific = once.filter(n => n !== "general");
  return specific.length ? specific : once;
}

/* ---------- parsing a list ---------- */

/* Splits pasted text into rows of cells. Tabs, then ";", then "," when a
   line has them; otherwise whitespace runs. */
function splitRows(text){
  /* Lists pasted from an email often put every site on one line, separated
     by " · " or " ; ". Those become rows first. */
  const flat = String(text || "").replace(/\r/g, "").replace(/\s[·•|]\s|\s;\s/g, "\n");
  /* Leading tabs stay: a sheet row whose first cell is empty must keep its
     column positions. Trailing whitespace goes. */
  const lines = flat.split("\n").map(l => l.replace(/^ +/, "").replace(/\s+$/, "")).filter(Boolean);
  const sep = lines.some(l => l.includes("\t")) ? "\t" : lines.filter(l => l.includes(";")).length > lines.length / 2 ? ";" : lines.filter(l => l.includes(",")).length > lines.length / 2 ? "," : null;
  const prose = l => l.split(/\s{2,}|\s[-–\/:]\s|\s+(?=[€$£]?\s?\d)/);
  return lines.map(l => {
    if(!sep) return prose(l).map(c => c.trim()).filter(Boolean);
    /* A comma-separated line is usually a CSV row, but "a.com, b.com - 300
       EUR" is prose with a comma: a cell that is neither a domain nor a
       price is split again like prose. */
    /* Tab rows keep their empty cells: a sheet with merged header cells
       ("Ahrefs" over DR, RD, Traffic) has blanks, and the column index must
       still match the row below. */
    if(sep === "\t") return splitCsvLine(l, sep).map(c => c.trim());
    return splitCsvLine(l, sep).map(c => c.trim()).filter(Boolean)
      .flatMap(c => (sep !== "\t" && !normaliseDomain(c) && !isPriceCell(c) && /\s/.test(c)) ? prose(c).map(x => x.trim()).filter(Boolean) : [c]);
  });
}
function splitCsvLine(line, sep){
  const out = []; let cur = ""; let q = false;
  for(let i = 0; i < line.length; i++){
    const ch = line[i];
    if(ch === '"'){ if(q && line[i + 1] === '"'){ cur += '"'; i++; } else q = !q; }
    else if(ch === sep && !q){ out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}

/* A list in, items out. Each item: {domain, path, raw, prices:{niche:{amount,
   currency,text}}, terms, line}. `terms` keeps the words that are neither a
   domain nor a price ("do follow, permanent", "sponsored tag").
   A header row (no domain, niche words) names the price columns. Without a
   header, the first price on a line is `general`, the second `casino`. */
function parseList(text){
  const rows = splitRows(text);
  const items = [];
  const skipped = [];
  let columns = null;   /* niches per cell index, when the header names the domain column */
  let headers = null;   /* the header's words per cell index, to label the other cells */
  let domainCol = -1;   /* the header's domain column: a sheet row is one site */
  let order = null;     /* niches in order of the prices, when it does not ("General / Casino / CBD") */
  let group = [];       /* domains named on a line without prices; the price lines below belong to them */
  let signedOff = false;
  let pending = null;   /* a price line above its domains: "£100 football / £150 any other links" */
  let skip = 0;
  const tabbed = /\t/.test(String(text || ""));
  /* A header row has no domain and no price with a currency; a bare number
     ("427" sites) is allowed. */
  const noOffer = cells => !cells.some(c => normaliseDomain(c)) && !cells.some(c => findPrice(c));
  const isHeader = cells => cells.some(c => /domain|dominio|site|web|url/i.test(c) && !nicheOf(c)) && cells.some(c => nichesOf(c).length);
  const setHeader = cells => {
    columns = cells.map(nichesOf); headers = cells.map(c => c.replace(/\s+/g, " ").trim()); order = null;
    domainCol = cells.findIndex(c => /domain|dominio|site|web|url/i.test(c) && !nicheOf(c));
  };
  /* Header rows of a sheet joined into one: a merged cell is carried across
     its blanks wherever a row below has something, and the rows are read
     top-down per column, so "PRICE / ARTICLE (EUR)" over "Special Content"
     over "Advertorial (GAMBLING)" is one column name. */
  const joinHeader = part => {
    const n = Math.max(...part.map(r => r.length));
    const carry = part.map(() => "");   /* per row, across the columns */
    const out = [];
    for(let j = 0; j < n; j++){
      const words = [];
      part.forEach((r, k) => {
        let c = (r[j] || "").replace(/\s+/g, " ").trim();
        if(c) carry[k] = c; else if(part.slice(k + 1).some(x => (x[j] || "").trim())) c = carry[k];
        if(c) words.push(c);
      });
      out.push(words.join(" "));
    }
    return out;
  };
  rows.forEach((cells, i) => {
    if(skip){ skip--; return; }
    const line = cells.filter(Boolean).join(" ");
    /* A pasted thread holds several messages (mattbarltd, 09/10: the list
       was two replies down). A message header ends the signature of the
       one above and starts reading again. */
    if(MSG_HEAD.test(line)){ signedOff = false; group = []; pending = null; columns = null; headers = null; order = null; domainCol = -1; skipped.push({ line: i + 1, text: line }); return; }
    /* A sheet header on several rows (MM Group Media: two; librawebcorp:
       three under a title row, 09/10). Rows without an offer at the top of a
       sheet are joined; the join that names the most niche columns wins; a
       row with one cell (a title, a year) is skipped but not joined. */
    if(tabbed && !group.length && noOffer(cells)){
      const block = [cells];
      while(i + block.length < rows.length && block.length < 6 && noOffer(rows[i + block.length])) block.push(rows[i + block.length]);
      let best = null;
      for(let n = 1; n <= block.length; n++){
        const part = block.slice(0, n).filter(r => r.filter(Boolean).length > 1);
        if(!part.length) continue;
        const joined = joinHeader(part);
        if(!isHeader(joined)) continue;
        const score = joined.filter(c => nichesOf(c).length).length;
        if(!best || score >= best.score) best = { n, joined, score };
      }
      if(best){ setHeader(best.joined); skip = best.n - 1; return; }
    }
    /* After "Thanks," / "Best regards" / "Multumesc" what follows is a
       signature: its domain and phone are not an offer. */
    if(signedOff){ skipped.push({ line: i + 1, text: line }); return; }
    if(SIGN_OFF.test(line) && !cells.some(c => normaliseDomain(c))){ signedOff = true; pending = null; skipped.push({ line: i + 1, text: line }); return; }
    /* One site per sheet row: the header's domain column when there is one;
       otherwise the first cell of each host, so a "Sample Post" URL on the
       same site is not a second item. */
    let domIdxs = cells.map((c, j) => normaliseDomain(c) ? j : -1).filter(j => j >= 0);
    if(domIdxs.length > 1){
      if(domainCol >= 0 && domIdxs.includes(domainCol)) domIdxs = [domainCol];
      else { const seen = new Set(); domIdxs = domIdxs.filter(j => { const h = normaliseDomain(cells[j]).domain; if(seen.has(h)) return false; seen.add(h); return true; }); }
    }
    /* A bare one- or two-digit number is a metric (DR, DA), unless the header
       puts that column under a niche: "40" under Advertorial (GAMBLING). */
    const priceIdxs = cells.map((c, j) => isPriceCell(c) && (!/^\d{1,2}$/.test(c.trim()) || (columns && columns[j] && columns[j].length)) ? j : -1).filter(j => j >= 0);
    const inlinePrices = priceIdxs.length ? priceIdxs : (!columns && !order ? [] : priceIdxs);
    if(!domIdxs.length){
      const niches = cells.map(nicheOf);
      /* A header names niches and carries no price. One that also names the
         domain column maps by index and may appear again (a second sheet);
         one that does not maps by position and is taken once. */
      const namesDomain = cells.some(c => /domain|dominio|site|web|url/i.test(c) && !nicheOf(c));
      /* In pasted prose a sentence can name niches and "websites" without
         being a header ("which other niche links are accepted: Crypto,
         Forex?", Senad, 04/02): a header has short cells, most of them a
         niche or the domain column, and no sentence punctuation. */
      const headerLike = tabbed || (cells.length >= 2 && cells.every(c => c.length <= 60 && !/^[-•*]|^(no|not|non|without|nicht|kein|sin|fără)\b/i.test(c)) && !/[?!.]$/.test(line) &&
        cells.filter(c => nichesOf(c).length || /^(domain|dominio|site|website|web|url)s?$/i.test(c)).length >= Math.max(2, cells.length - 1));
      if(headerLike && niches.some(Boolean) && !priceIdxs.length && (namesDomain || (!columns && !order && !group.length))){
        if(namesDomain) setHeader(cells);
        else order = cells.map(nichesOf).filter(a => a.length);
        return;
      }
      /* A price line above its domains: "£100 football links / £150 any
         other links", then the sites, one per line (mattbarltd, 09/10). Each
         price takes the niches its words name; "any other links", "all
         links" or a lone price is general; a topical price ("football") is
         kept in the terms only. The next prose line closes it. */
      if(!group.length){
        const found = pricesOfLine(line);
        if(found.length && !columns && !order){
          const prices = {};
          found.forEach((f, k) => {
            let niches = nichesOf(f.label);
            if(!niches.length && (/\bany other\b|\ball links\b|\bother links\b|^all\b|^other\b|\brest\b/i.test(f.label) || found.length === 1)) niches = ["general"];
            niches.forEach(n => { if(!prices[n]) prices[n] = f.price; });
          });
          pending = { prices, text: line };
          skipped.push({ line: i + 1, text: line });
          return;
        }
        pending = null;
      }
      /* A price line under a group of domains: "1. Articol SEO - 35 EUR",
         "Bet / Casino - 100 EUR + TVA". The niche comes from the words on
         the line, general when none; the first price per niche wins. */
      const inProse = group.length && !priceIdxs.length ? findPrice(line) : null;
      if(group.length && (priceIdxs.length || inProse)){
        const p = priceIdxs.length ? parsePrice(cells[priceIdxs[0]]) : inProse;
        const found = nichesOf(line).filter(n => n !== "general");
        const niches = found.length ? found : ["general"];
        for(const it of group){
          niches.forEach(n => { if(!it.prices[n]) it.prices[n] = p; });
          it.terms = [it.terms, line].filter(Boolean).join(" | ");
        }
        return;
      }
      if(group.length && !priceIdxs.length && /dofollow|do-?follow|nofollow|permanent|pe viata|lifetime|marcat|marked|sponsored|valid/i.test(line)){
        for(const it of group) it.terms = [it.terms, line].filter(Boolean).join(" | ");
        skipped.push({ line: i + 1, text: line });   /* also a list-wide statement */
        return;
      }
      skipped.push({ line: i + 1, text: line });
      return;
    }
    /* Domains with no price on their line take the price line above them,
       or open a group for the price lines below. */
    if(!priceIdxs.length){
      if(pending){
        domIdxs.forEach(j => { const d = normaliseDomain(cells[j]); items.push({ domain: d.domain, path: d.path, raw: cells[j], prices: Object.assign({}, pending.prices), terms: pending.text, line: i + 1 }); });
        return;
      }
      group = domIdxs.map(j => {
        const d = normaliseDomain(cells[j]);
        const it = { domain: d.domain, path: d.path, raw: cells[j], prices: {}, terms: "", line: i + 1 };
        items.push(it); return it;
      });
      return;
    }
    group = [];
    const guessing = !columns && !order;
    const made = domIdxs.map(j => { const d = normaliseDomain(cells[j]); return { domain: d.domain, path: d.path, raw: cells[j], prices: {}, terms: "", line: i + 1 }; });
    const terms = [];
    /* Under a header, a cell that is not a price for a niche is shown with
       its column name: "Ahrefs DR: 44", "Link Insert Normal: 110 €". */
    const labelled = (j, c, isPrice) => {
      if(!headers || !headers[j]) return c;
      /* "casino: no" for a refusal under a niche column; a second price for
         the same niche keeps its column name ("... Advertorial (branding): 145"). */
      if(columns[j] && columns[j].length) return (isPrice ? headers[j] : columns[j].join("+")) + ": " + c;
      if(/^\d{1,2}$/.test(headers[j]) || /terms|notes?|comments?|conditions|remarks|info|observa/i.test(headers[j])) return c;
      return headers[j] + ": " + c;
    };
    let nth = 0;
    cells.forEach((c, j) => {
      if(domIdxs.includes(j)) return;
      const p = isPriceCell(c) && !(guessing && /^\d{1,2}$/.test(c.trim())) ? parsePrice(c) : null;
      if(p){
        /* A header decides the niche: by column when it names the domain
           column, by position otherwise. Without a header the first price is
           general and the second casino; a third is kept as a term. */
        const target = columns ? columns[j] : order ? order[nth] : (nth === 0 ? "general" : nth === 1 ? "casino" : null);
        nth++;
        const niches = Array.isArray(target) ? target : target ? [target] : [];
        let used = false;
        for(const it of made){
          const free = niches.filter(n => !it.prices[n]);
          if(free.length){ free.forEach(n => { it.prices[n] = p; }); used = true; }
        }
        if(!used) terms.push(labelled(j, c, true));
      }else if(c){
        terms.push(labelled(j, c));
      }
    });
    made.forEach(it => { it.terms = terms.join(" | "); items.push(it); });
  });
  /* A domain named without any price, and nothing below it, stays as an
     item with no price: the person sees it and decides. */
  return { items, skipped, columns: columns ? columns.map(a => a.length ? a.join("+") : null) : (order ? order.map(a => a.join("+")) : null) };
}
/* The start of a message inside a pasted thread, in the mail clients and
   languages seen so far. */
const MSG_HEAD = /^(from|de|von|da|šalje|od|poslano|sent|enviado|gesendet|wysłano|date|to|an|prima|para)\s*:|^on .{3,80} wrote:?$|^el .{3,80} escribi[oó]:?$|^am .{3,80} schrieb.{0,40}:?$|^le .{3,80} a écrit ?:?$|^-{2,}\s*(original|forwarded|mensaje original|ursprüngliche)/i;
/* Every price in a line, each with the words that follow it up to the next
   price: "£100 football links / £150 any other links". */
function pricesOfLine(line){
  const re = /(?:€|\$|£|\beur(?:os?)?\b|\busd\b|\bgbp\b)\s*\d[\d.,]*|\d[\d.,]*\s*(?:€|\$|£|\beur(?:os?)?\b|\busd\b|\bgbp\b)/gi;
  const hits = []; let m;
  while((m = re.exec(line))) hits.push([m.index, m[0]]);
  return hits.map(([at, txt], k) => {
    const end = k + 1 < hits.length ? hits[k + 1][0] : line.length;
    const label = line.slice(at + txt.length, end).replace(/^[\s\/|·,;:-]+|[\s\/|·,;:-]+$/g, "").trim();
    return { price: parsePrice(txt), label, text: txt };
  }).filter(f => f.price);
}
const SIGN_OFF = /^(thanks|thank you|many thanks|best|best regards|kind regards|regards|cheers|saludos|gracias|un saludo|atentamente|multumesc|mulțumesc|cu stima|mit freundlichen|viele grüße|beste grüße|lg|cordialement|met vriendelijke|vänliga hälsningar|mvh)\b/i;

/* A sheet read as rows of cells (SheetJS sheet_to_json with header: 1, or
   any 2D array) becomes the tab-separated text parseList reads. Empty rows
   are dropped; numbers keep their value. Several sheets are joined, each
   with a blank line between them; each sheet's own header row resets the
   column mapping. No title line: "Sheet: Prices" would read as a header. */
function tableToList(rows){
  const lines = (rows || []).map(r => (r || []).map(c => c == null ? "" : String(c).replace(/\t|\n/g, " ").trim()).join("\t")).filter(l => l.replace(/\t/g, "").trim());
  return lines.join("\n");
}

/* ---------- a PDF's text ----------
   pdf.js gives the text of a page as items with a position (transform[4],
   transform[5]) and a width, in no useful order and with no lines. This
   rebuilds lines from the baselines and, when the page is a table (drivar.de
   price list, 09/10), its columns from the x positions, as tab-separated
   rows, so parseList reads it like a sheet. A long cell wrapped onto the
   next line ("https://motion-drive-" over "vermietung.de") is glued back to
   its row. */
function pdfTextOf(items){
  const rows = [];
  for(const it of items || []){
    if(!it || !it.str || !it.str.trim() || !it.transform) continue;
    const y = it.transform[5], x = it.transform[4];
    let row = null;
    for(const r of rows){ if(Math.abs(r.y - y) < 2.5){ row = r; break; } }
    if(!row){ row = { y, parts: [] }; rows.push(row); }
    row.parts.push({ x, s: it.str, w: it.width || 0 });
  }
  rows.sort((a, b) => b.y - a.y);
  rows.forEach(r => {
    r.parts.sort((a, b) => a.x - b.x);
    /* A glyph the font maps wrongly: in the drivar.de PDF every "f" came as
       a one-letter item "E" between lowercase letters ("rundElug.com").
       A lone capital E glued to lowercase letters on both sides is an f. */
    r.parts.forEach((p, k) => {
      const a = r.parts[k - 1], b = r.parts[k + 1];
      const before = !a || (/[a-z\/.-]$/.test(a.s) && p.x - (a.x + a.w) < 1.5);   /* or the line starts with it ("Einden.com" under "https://mentor-") */
      if(p.s === "E" && b && before && /^[a-z]/.test(b.s) && b.x - (p.x + p.w) < 1.5) p.s = "f";
    });
    /* Touching items are one word; a gap is a space. */
    const merged = [];
    for(const p of r.parts){
      const last = merged[merged.length - 1];
      if(last && p.x - (last.x + last.w) < 1.5 && !/\s$/.test(last.s) && !/^\s/.test(p.s)){ last.s += p.s; last.w = p.x + p.w - last.x; }
      else merged.push({ x: p.x, s: p.s, w: p.w });
    }
    r.parts = merged.map(p => ({ x: p.x, w: p.w, s: p.s.replace(/\s+/g, " ").trim() })).filter(p => p.s);
  });
  /* A table: at least three rows with four or more cells. Its columns are
     the x positions of the row with most cells (the header, usually); each
     cell goes to the nearest column start. Otherwise prose: words joined. */
  const wide = rows.filter(r => r.parts.length >= 4);
  if(wide.length < 3) return rows.map(r => r.parts.map(p => p.s).join(" ")).join("\n");
  const template = wide.reduce((a, b) => b.parts.length > a.parts.length ? b : a, wide[0]);
  const cols = template.parts.map(p => p.x);
  const colOf = x => { let best = 0; cols.forEach((c, k) => { if(Math.abs(c - x) < Math.abs(cols[best] - x)) best = k; }); return best; };
  const table = rows.map(r => {
    const cells = cols.map(() => "");
    r.parts.forEach(p => { const k = colOf(p.x); cells[k] = cells[k] ? cells[k] + " " + p.s : p.s; });
    return cells;
  });
  /* A wrapped cell: a row of one or two cells, no digit, each under a cell
     of the row above, which has digits (a data row). It continues that row:
     a domain or a word cut at "-" or "/" without a space, anything else
     with one. */
  const out = [];
  for(const cells of table){
    const filled = cells.map((c, k) => c ? k : -1).filter(k => k >= 0);
    const prev = out[out.length - 1];
    const isUrl = c => /^(https?:\/\/|www\.)|\.[a-z]{2,}(\/|$)/i.test(c);
    /* Under a domain, only a piece that continues it: the domain was cut
       ("-", "/", ".") or the piece carries a dot ("shop.de"). "Inclusive"
       under the last row is a note, not a domain. */
    const fits = k => !isUrl(prev[k]) || /[-\/.]$/.test(prev[k]) || (/\./.test(cells[k]) && /^[a-z]/.test(cells[k]));
    const continues = prev && filled.length && filled.length <= 2 && !cells.some(c => /\d/.test(c)) && prev.some(c => /\d/.test(c)) && filled.every(k => prev[k] && fits(k));
    if(continues){
      filled.forEach(k => { const glue = /[-\/.]$/.test(prev[k]) || isUrl(prev[k]) ? "" : " "; prev[k] += glue + cells[k]; });
      continue;
    }
    out.push(cells);
  }
  /* A row with one cell is a line of prose (title, note): no tabs. */
  return out.map(cells => cells.filter(Boolean).length <= 1 ? cells.filter(Boolean).join("") : cells.join("\t")).join("\n");
}

/* ---------- the database side ---------- */

/* Column names of "Import Database" as the sheet has them, read through the
   Drive connector on 07/10/2026. In the sheet several carry a line break or
   a double space ("Ahrefs \nDomain Rating", "Unlicensed \nCasino"); here they
   are written in one line and matched through `headerKey`, which collapses
   whitespace and case. "removed sites" has 43 of these (no Unlicensed
   Casino) and spells "Majestic Citatian Flow"; headerKey tolerates that too. */
const DB_COLUMNS = ["Type", "TLD", "Domain", "Webmaster Contact", "Webmaster Extra Contact", "Contact Name", "IP Address",
  "Ahrefs Domain Rating", "Ahrefs Referring Domains", "Ahrefs Organic Traffic", "Ahrefs URL Rating", "Ahrefs Top 3 Keywords", "Ahrefs Top 4-10 Keywords",
  "Majestic Trust Flow", "Majestic Citation Flow", "MOZ Spam Score", "MOZ Domain Authority", "Semrush Authority Score", "TF / CF", "RD / OT",
  "Buying Casino", "Buying Unlicensed Casino", "Buying Crypto", "Buying Forex", "Buying CBD", "Buying Dating", "Buying General",
  "Casino", "Unlicensed Casino", "Crypto", "Forex", "CBD", "Dating", "General",
  "Sponsor Tag Type", "Link Type", "Placement", "Price Validity", "Admin Comments", "User Comments", "Last Updated",
  "Main Country", "Main Country Traffic", "Domain Language", "Website Topic"];

/* "Ahrefs \nDomain Rating" and "Ahrefs  Domain Rating" are the same column. */
function headerKey(h){
  return String(h || "").toLowerCase().replace(/\s+/g, " ").trim().replace("citatian", "citation");
}
const KEY_TO_COLUMN = new Map(DB_COLUMNS.map(c => [headerKey(c), c]));

/* Renames a row read from the sheet (or a CSV of it) to the one-line column
   names above, so the rest of the module can use `row["Buying Casino"]`.
   Columns the module does not know are kept as they are. */
function normaliseRow(row){
  const out = {};
  for(const k in row){ out[KEY_TO_COLUMN.get(headerKey(k)) || k] = row[k]; }
  return out;
}

/* Fixed values the database accepts (CLAUDE.md of the desk, Gary 07/10, and
   the sample rows of 07/10). Anything else goes to a comment, not a column. */
const FIXED = {
  type: ["Publisher", "Broker"],
  linkType: ["Do follow", "No follow"],
  placement: ["1 Year", "2 Years", "permanent"],
  priceValidity: ["Fixed", "Not fixed"],   /* or a date */
  sponsorTag: ["", "Marked by WM", "rel=sponsored"]
};
const BUYING_COLUMN = { casino: "Buying Casino", unlicensedCasino: "Buying Unlicensed Casino", crypto: "Buying Crypto", forex: "Buying Forex", cbd: "Buying CBD", dating: "Buying Dating", general: "Buying General" };

/* The contact column: "Webmaster Contact" in 2026, "Contact email" in the
   2024 copies. */
function senderOf(row){
  return String(row["Webmaster Contact"] || row["Contact email"] || row.email || "").trim().toLowerCase();
}

/* Builds the lookup from rows ({column: value} objects, as the Worker reads
   them). `removed` are the rows of the "removed sites" tab. Several rows may
   share a domain: all are kept. */
function indexDatabase(rows, removed){
  const byDomain = new Map();
  const bySender = new Map();
  const add = (map, k, v) => { if(!k) return; const a = map.get(k); if(a) a.push(v); else map.set(k, [v]); };
  (rows || []).forEach((raw, i) => {
    const r = normaliseRow(raw);
    const d = normaliseDomain(r.Domain || r.domain);
    if(!d) return;
    add(byDomain, d.domain, { row: r, index: i });
    add(bySender, senderOf(r), d.domain);
  });
  const removedSet = new Map();
  (removed || []).forEach((raw, i) => {
    const r = normaliseRow(raw);
    const d = normaliseDomain(r.Domain || r.domain);
    if(d) add(removedSet, d.domain, { row: r, index: i });
  });
  return { byDomain, bySender, removed: removedSet, size: byDomain.size };
}

/* ---------- the database screen's filter, shared by page and Worker ----------
   One predicate, one search string, one facet count: the page filters the
   rows it holds and the Worker filters the sheet, and the two must agree
   (review of 08/10: they had drifted). */

/* The text a search looks in: domain, contacts and name, lowercase. */
function searchText(row){
  return (String(row.Domain || "") + " " + senderOf(row) + " " + String(row["Contact Name"] || "") + " " + String(row["Webmaster Extra Contact"] || "")).toLowerCase();
}

/* A row ready for the screen: normalised headers plus `_q` (search text) and
   `_type` (Type, trimmed). Done once where rows enter, never per keystroke. */
function prepareRow(raw){
  const r = normaliseRow(raw);
  r._q = searchText(r);
  r._type = String(r.Type || "").trim();
  return r;
}

/* Filters: {q, type, country, lang, niche}. type "-" means blank Type. The
   row may be prepared or not; unprepared rows are read field by field. */
function rowMatchesFilters(r, f){
  const type = r._type != null ? r._type : String(r.Type || "").trim();
  if(f.type === "-" ? type !== "" : f.type && type !== f.type) return false;
  if(f.country && String(r["Main Country"] || "") !== f.country) return false;
  if(f.lang && String(r["Domain Language"] || "") !== f.lang) return false;
  if(f.niche && BUYING_COLUMN[f.niche] && !String(r[BUYING_COLUMN[f.niche]] ?? "").trim()) return false;
  const q = String(f.q || "").trim().toLowerCase();
  if(q && !(r._q != null ? r._q : searchText(r)).includes(q)) return false;
  return true;
}

/* Countries and languages present, most frequent first. */
function facetsOf(rows){
  const c = new Map(), l = new Map();
  for(const r of rows){ const a = String(r["Main Country"] || "").trim(), b = String(r["Domain Language"] || "").trim(); if(a) c.set(a, (c.get(a) || 0) + 1); if(b) l.set(b, (l.get(b) || 0) + 1); }
  const top = m => [...m.entries()].sort((x, y) => y[1] - x[1]).map(x => x[0]);
  return { countries: top(c), languages: top(l) };
}

/* Compares an item's prices with the row's Buying columns. Returns the list
   of niches with a difference, each {niche, offered, inDatabase}. A price the
   list does not mention is not a difference. */
function priceDiff(item, row){
  const diffs = [];
  for(const niche of NICHES){
    const offered = item.prices[niche];
    if(!offered) continue;
    const have = parsePrice(row[BUYING_COLUMN[niche]]);
    if(!have || have.amount !== offered.amount || have.currency !== offered.currency){
      diffs.push({ niche, offered, inDatabase: have });
    }
  }
  return diffs;
}

/* Matches a parsed list against the index. Groups:
   - unchanged: in the database, every offered price equal;
   - changed: in the database, at least one price differs (or none recorded);
   - unknown: not in the database;
   - removed: in "removed sites" (shown apart, never written as new).
   `sender` is the email the list came from; when the database already has it
   on `brokerHintAt` or more domains, `brokerHint` is set on every item. */
function matchList(items, index, { sender, brokerHintAt = 10, senderCount } = {}){
  const groups = { unchanged: [], changed: [], unknown: [], removed: [] };
  const mail = String(sender || "").trim().toLowerCase();
  /* senderCount comes from the Worker, which sees the whole sheet; the
     local index only sees the rows it was given. */
  const known = senderCount != null ? senderCount : (mail ? (index.bySender.get(mail) || []).length : 0);
  const brokerHint = known >= brokerHintAt ? known : 0;
  for(const item of items){
    const hit = index.byDomain.get(item.domain) || [];
    const gone = index.removed.get(item.domain) || [];
    const base = { item, rows: hit.map(h => h.row), rowIndexes: hit.map(h => h.index), brokerHint };
    if(gone.length){ groups.removed.push({ ...base, removedRows: gone.map(g => g.row) }); continue; }
    if(!hit.length){ groups.unknown.push(base); continue; }
    const diffs = hit.map(h => priceDiff(item, h.row));
    const allEqual = diffs.every(d => d.length === 0);
    if(allEqual) groups.unchanged.push({ ...base, diffs });
    else groups.changed.push({ ...base, diffs, sameSender: !!mail && hit.some(h => senderOf(h.row) === mail) });
  }
  return groups;
}

/* ---------- terms, as the database's fixed values ---------- */

/* Reads the free text of an item ("do follow, permanent, prices valid until
   31.12.2026, marked as Werbung") into the fixed values of the sheet. Empty
   string means the list did not say. `adminComments` holds only the phrases
   the team uses. */
function termsOf(item){
  const text = item.terms || "";
  const t = text.toLowerCase();
  const notMarked = /not marked as sponsored|not marked or tagged|no sponsored (tag|label)|without (a |any )?sponsored|not tagged as sponsored|nicht als (werbung|anzeige) (markiert|gekennzeichnet)|sin (etiqueta|marca) (de )?patrocin/.test(t);
  const marked = notMarked ? null : text.match(/(?:marked\s+as|marcat(?:\s+cu)?|gekennzeichnet\s+als|marcado\s+como)\s+["“'(]?([\p{L}\d-]+)[)"”']?/iu);
  const sponsorTag = notMarked ? "" : /rel=sponsored|sponsored (tag|link)s? (is |are )?(mandatory|required|added|used|included|obligator)|with (a |the )?sponsored (tag|link)|marked as sponsored|as sponsored/.test(t) ? "rel=sponsored" : (marked || /marked by (the )?(wm|webmaster)/.test(t)) ? "Marked by WM" : "";
  /* "permanent placement on request", "do-follow instead of no-follow:
     +99€" (drivar.de, 09/10) are options, not the included terms: a clause
     that says so is left out when reading link type and placement. */
  const t2 = t.replace(/[^.|\n]*(on request|auf anfrage|a petición|la cerere|optional|surcharge|aufpreis|extra charge|\+\s?\d)[^.|\n]*/g, " ");
  const linkType = /no-?\s?follow/.test(t2) ? "No follow" : /do-?\s?follow|dofollow/.test(t2) ? "Do follow" : "";
  const placement = /permanent|lifetime|forever|dauerhaft|permanente|pe viata|pe viață|for life/.test(t2) ? "permanent" : /2\s*(years?|jahre|años)|24\s*(months?|monate)/.test(t2) ? "2 Years" : /1\s*(year|jahr|año)|12\s*months?/.test(t2) ? "1 Year" : "";
  const until = text.match(/valid(?:o|a)?s?\s*(?:until|hasta|till|bis)\s*([\d.\/-]+)/i);
  const priceValidity = until ? until[1].replace(/[.\/-]+$/, "") : /\bfixed\b|\bfijo\b|\bfest(e|er|es|en)?\b/.test(t) ? "Fixed" : /not fixed|negotiable|negociable|verhandelbar/.test(t) ? "Not fixed" : "";
  const adminComments = [];
  if(marked) adminComments.push(`Marked as "${marked[1]}"`);
  if(item.prices && item.prices.unlicensedCasino) adminComments.push(`Unlicensed Casinos - ${formatPrice(item.prices.unlicensedCasino)} EUR`);
  else if(/unlicen[cs]ed casinos? accepted/.test(t)) adminComments.push("Unlicensed Casinos Accepted");
  else if(/only (properly |duly )?licen[cs]ed|no (any )?illegal gambling|non[- ]?gamstop|gambling \(legal\)|licen[cs]ed (casinos?|gambling|operators?) only/.test(t)) adminComments.push("Only Licensed Casinos");
  if(/written by (the )?(wm|webmaster)/.test(t)) adminComments.push("Written by WM");
  if(/no ?index/.test(t)) adminComments.push("NO INDEX");
  return { sponsorTag, linkType, placement, priceValidity, adminComments };
}

/* Terms the email states once for the whole list ("Do-Follow-Links ·
   Dauerhafte Veröffentlichung"), read from the lines parseList skipped.
   Applied to every item that says nothing itself. */
function listTermsOf(parsed){
  const text = (parsed.skipped || []).map(l => l.text).join(" | ");
  const f = termsOf({ terms: text, prices: {} });
  f.text = text;
  f.any = !!(f.linkType || f.placement || f.priceValidity || f.sponsorTag || f.adminComments.length);
  return f;
}

/* Fills an item's empty terms from the list's. Returns a copy; `inherited`
   says the terms came from the list, not the row. */
function withListTerms(item, listTerms){
  if(!listTerms || !listTerms.any) return item;
  if(!item.terms) return { ...item, terms: listTerms.text, inherited: true };
  /* The row says something, but not everything: add the list's text so the
     missing fixed values (a "pe viata" line after the groups) are read too. */
  const own = termsOf(item);
  const missing = ["linkType", "placement", "priceValidity", "sponsorTag"].some(k => !own[k] && listTerms[k]);
  if(!missing || item.terms.includes(listTerms.text)) return item;
  return { ...item, terms: item.terms + " | " + listTerms.text, inheritedPartly: true };
}

/* Offered minus recorded, per niche, for a changed row: {niche, offered,
   inDatabase, delta, pct}. pct is relative to the recorded price. */
function priceDelta(diffs){
  return (diffs || []).map(d => {
    const a = d.offered ? d.offered.amount : null, b = d.inDatabase ? d.inDatabase.amount : null;
    const delta = a != null && b != null ? a - b : null;
    return { ...d, delta, pct: delta != null && b ? Math.round(delta / b * 100) : null };
  });
}

/* ---------- the row that Accept writes ---------- */

/* Builds a full row (array in DB_COLUMNS order) for an unknown domain the
   person accepted, or the changed cells for a known one. Only Buying columns,
   terms, contact and bookkeeping are filled; metrics stay empty for the team.
   `who` is the desk user's email, `listLabel` names the list ("starmagazines
   05/10"). Nothing here touches the sheet: the Worker does, on Accept. */
function rowForAccept(item, { type = "Publisher", sender = "", contactName = "", who = "", listLabel = "", today = new Date() } = {}){
  const d = String(today.getDate()).padStart(2, "0"), m = String(today.getMonth() + 1).padStart(2, "0"), y = today.getFullYear();
  const row = Object.fromEntries(DB_COLUMNS.map(c => [c, ""]));
  row.Type = FIXED.type.includes(type) ? type : "Publisher";
  row.Domain = item.domain;
  row.TLD = "." + item.domain.split(".").slice(1).join(".");
  row["Webmaster Contact"] = sender;
  row["Contact Name"] = contactName;
  for(const niche of NICHES){
    const p = item.prices[niche];
    if(p) row[BUYING_COLUMN[niche]] = formatPrice(p);
  }
  const fixed = termsOf(item);
  row["Sponsor Tag Type"] = fixed.sponsorTag;
  row["Link Type"] = fixed.linkType || "Do follow";
  row["Placement"] = fixed.placement;
  row["Price Validity"] = fixed.priceValidity;
  const admin = fixed.adminComments.slice();
  row["Admin Comments"] = admin.join("\n");
  /* User Comments is the team's, by hand: here only who accepted and from
     which list, so the row can be traced. */
  /* The database is in EUR (Gary, 06/10). A price given in another currency
     is written as given and said so, never converted here. */
  const foreign = NICHES.map(n => item.prices[n]).filter(p => p && p.currency && p.currency !== "EUR").map(p => p.currency).filter((c, i, a) => a.indexOf(c) === i);
  row["User Comments"] = [who && `Accepted by ${who}`, listLabel && `from list ${listLabel}`, foreign.length && `Prices in ${foreign.join("/")}, not converted`].filter(Boolean).join("; ");
  row["Last Updated"] = `${d}/${m}/${y}`;
  return row;
}

/* The 2026 database writes prices as bare numbers in EUR (1100, 250), read
   on 07/10. The 2024 Latam copy wrote "€ 400.00"; parsePrice reads both. */
function formatPrice(p){
  return Number.isInteger(p.amount) ? String(p.amount) : p.amount.toFixed(2);
}

function csvToObjects(text){
  const lines = text.replace(/\r/g, "").split("\n");
  const rows = []; let cur = []; let cell = ""; let q = false; let head = null;
  for(const line of lines){
    for(let i = 0; i < line.length; i++){
      const ch = line[i];
      if(ch === '"'){ if(q && line[i + 1] === '"'){ cell += '"'; i++; } else q = !q; }
      else if(ch === "," && !q){ cur.push(cell); cell = ""; }
      else cell += ch;
    }
    if(q){ cell += "\n"; continue; }
    cur.push(cell); cell = "";
    if(!head) head = cur.map(h => h.trim()); else if(cur.length > 1) rows.push(Object.fromEntries(head.map((h, j) => [h, cur[j] == null ? "" : cur[j]])));
    cur = [];
  }
  return rows;
}

   both tabs, found by name ("Import Database", "removed sites") or taken as

   on the next visit, so it is loaded once per export, not once per visit.

function idb(){
  return new Promise((ok, no) => {
    if(!window.indexedDB) return no(new Error("no IndexedDB"));
    const r = indexedDB.open("ljc-lists", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("files");
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  });
}
function idbPut(key, val){ return idb().then(db => new Promise((ok, no) => { const tx = db.transaction("files", "readwrite"); tx.objectStore("files").put(val, key); tx.oncomplete = () => ok(); tx.onerror = () => no(tx.error); })).catch(e => console.error("store:", e)); }
function idbGet(key){ return idb().then(db => new Promise((ok, no) => { const q = db.transaction("files", "readonly").objectStore("files").get(key); q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error); })).catch(() => null); }
function idbDel(key){ return idb().then(db => new Promise((ok, no) => { const tx = db.transaction("files", "readwrite"); tx.objectStore("files").delete(key); tx.oncomplete = () => ok(); tx.onerror = () => no(tx.error); })).catch(() => {}); }

      const rmName = names.find(n => n !== dbName && /remov|elimin/i.test(n)) || (names.length > 1 ? names.find(n => n !== dbName) : null);
      const objs = n => XLSX.utils.sheet_to_json(wb.Sheets[n], { defval: "", raw: false }).map(prepareRow);

function offeredCells(item, diffs){

  return NICHES.filter(n => item.prices[n]).map(n => {
    const d = deltas.get(n);
    let tail = "";
    if(d && d.delta != null && d.delta !== 0) tail = `<span class="delta ${d.delta > 0 ? "up" : "down"}">${d.delta > 0 ? "+" : "−"}${esc(formatPrice({ amount: Math.abs(d.delta) }))} · ${Math.abs(d.pct)}% ${d.delta > 0 ? t().dAbove : t().dBelow}</span>`;
    else if(d && d.inDatabase == null) tail = `<span class="delta up">${t().recorded}: —</span>`;
    return `<span class="pr${d ? " cambia" : ""}"><span class="k">${esc(t().niche[n])}</span>${esc(price(item.prices[n]))}${tail}</span>`;
  }).join("") || `<span class="sender">${t().noPrice}</span>`;
}
function termsCells(item){

/* ---------- the file they sent ---------- */
/* SheetJS is loaded only when an Excel file arrives, from cdnjs (the only
   script host the page may use), pinned. CSV and text need nothing. */
const SHEETJS = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
let sheetjs = null;
function loadSheetJS(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(sheetjs) return sheetjs;
  sheetjs = new Promise((ok, no) => {
    const s = document.createElement("script"); s.src = SHEETJS; s.async = true;
    s.onload = () => window.XLSX ? ok(window.XLSX) : no(new Error("no XLSX"));
    s.onerror = () => { sheetjs = null; no(new Error("load failed")); };
    document.head.appendChild(s);
  });
  return sheetjs;
}
/* pdf.js the same way, for rate cards sent as PDF (businessamlive sent one
   on 05/10). A PDF has no lines: the text of each page is rebuilt from the
   glyph positions, one line per baseline, left to right. The pinned version
   is 4.10.38; the worker is loaded from the same place. The text of a page
   is rebuilt by pdfTextOf in the module: lines, and columns when it is a
   table. */
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";
const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
let pdfjs = null;
function loadPdfJS(){
  if(pdfjs) return pdfjs;
  pdfjs = import(PDFJS).then(m => { m.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; return m; }, e => { pdfjs = null; throw e; });
  return pdfjs;
}
async function pdfText(buf){
  const lib = await loadPdfJS();
  const doc = await lib.getDocument({ data: buf }).promise;
  const pages = [];
  for(let n = 1; n <= doc.numPages; n++){
    const page = await doc.getPage(n);
    pages.push(pdfTextOf((await page.getTextContent()).items));
  }
  return { text: pages.join("\n\n"), pages: doc.numPages };
}
$("listfile").addEventListener("change", async () => {
  const f = $("listfile").files && $("listfile").files[0]; if(!f) return;
  $("filenote").textContent = t().fileLoading;
  try{
    if(/\.pdf$/i.test(f.name) || f.type === "application/pdf"){
      const r = await pdfText(await f.arrayBuffer());
      $("list").value = r.text;
      $("filenote").textContent = t().filePdf(f.name, r.pages);
    }else if(/\.(xlsx|xls|xlsm|ods)$/i.test(f.name)){
      const XLSX = await loadSheetJS();
      const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
      const parts = wb.SheetNames.map(n => tableToList(XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: "" }))).filter(Boolean);
      $("list").value = parts.join("\n\n");
      $("filenote").textContent = t().fileRead(f.name, wb.SheetNames.length);
    }else{
      $("list").value = await f.text();
      $("filenote").textContent = t().fileText(f.name);
    }
    if(!$("label").value.trim()) $("label").value = f.name.replace(/\.[^.]+$/, "");
    run();
  }catch(e){
    $("filenote").textContent = t().fileFail;
  }
});

let mode = "list";
const ROW_H = 34;
const dbState = { q: "", type: "", country: "", lang: "", niche: "", removed: false, wide: false, list: [], total: 0, sel: null, remotePages: new Map(), remoteTotal: 0 };
const NARROW = [
  ["Domain", 220], ["Type", 110], ["Contact", 230], ["Country", 120], ["Language", 100],
  ["Buying Casino", 84], ["Buying Unlicensed Casino", 84], ["Buying Crypto", 84], ["Buying Forex", 84], ["Buying CBD", 84], ["Buying Dating", 84], ["Buying General", 84],
  ["Terms", 230], ["Updated", 100]
];
const SHORT = { "Buying Casino": "Casino", "Buying Unlicensed Casino": "Unlic.", "Buying Crypto": "Crypto", "Buying Forex": "Forex", "Buying CBD": "CBD", "Buying Dating": "Dating", "Buying General": "General" };
function setMode(m){
  mode = m; try{ localStorage.setItem("ljc-lists-mode", m); }catch(e){}

  $("screen-db").hidden = m !== "db";

}
function dbSourceRows(){ return dbState.removed ? rmRows : dbRows; }
/* Facets once per source; the rows themselves are already prepared. */
let facetCache = new WeakMap();
function dbFacetsFor(rows){
  let f = facetCache.get(rows);
  if(!f){ f = facetsOf(rows); facetCache.set(rows, f); }
  return f;
}
/* Rebuilds a <select> and returns the value it shows, so the state can be
   written back: a country kept from the other tab that this tab does not
   have must not keep filtering invisibly (review of 08/10). */
function fillSelect(id, values, keep){
  const sel = $(id); const first = sel.options[0];
  sel.innerHTML = ""; sel.appendChild(first);
  values.forEach(v => { const o = document.createElement("option"); o.value = v; o.textContent = v; sel.appendChild(o); });
  sel.value = values.includes(keep) ? keep : "";
  return sel.value;
}
function dbRefresh(){
  if(remote){ dbState.remotePages.clear(); dbRemoteFetch(0, true); return; }
  const rows = dbSourceRows();
  const f = dbFacetsFor(rows);
  dbState.country = fillSelect("db-country", f.countries, dbState.country);
  dbState.lang = fillSelect("db-lang", f.languages, dbState.lang);
  dbState.list = rows.filter(r => rowMatchesFilters(r, dbState));

}
function dbCell(r, c){
  if(c === "Domain") return `<div class="d" title="${esc(r.Domain)}">${esc(r.Domain)}</div>`;
  if(c === "Type"){ const ty = String(r.Type || "").trim(); return `<div>${ty ? `<span class="tipo ${ty.toLowerCase() === "broker" ? "broker" : ""}">${esc(ty)}</span>` : `<span class="mut">—</span>`}</div>`; }

  if(c === "Country") return `<div class="s">${esc(r["Main Country"] || "")}</div>`;
  if(c === "Language") return `<div class="s">${esc(r["Domain Language"] || "")}</div>`;

function dbDraw(){

/* --- the Worker's pages, 300 rows each, fetched for the window on screen --- */
const PAGE = 300;
function dbRemoteRow(i){
  const page = Math.floor(i / PAGE), rows = dbState.remotePages.get(page);
  if(rows === undefined){ dbRemoteFetch(page * PAGE, false); dbState.remotePages.set(page, null); return null; }
  return rows ? rows[i - page * PAGE] : null;
}
function dbRemoteQuery(offset){
  const p = new URLSearchParams({ offset: String(offset), limit: String(PAGE) });
  if(dbState.q.trim()) p.set("q", dbState.q.trim());
  if(dbState.type) p.set("type", dbState.type);
  if(dbState.country) p.set("country", dbState.country);
  if(dbState.lang) p.set("lang", dbState.lang);
  if(dbState.niche) p.set("niche", dbState.niche);
  if(dbState.removed) p.set("removed", "1");
  return p.toString();
}
async function dbRemoteFetch(offset, first){
  const key = dbRemoteQuery(offset);
  try{
    const r = await fetch("/api/rows?" + key);
    if(!r.ok) throw new Error(String(r.status));
    const j = await r.json();
    if(dbRemoteQuery(offset) !== key) return;   /* filters changed meanwhile */
    dbState.remotePages.set(Math.floor(offset / PAGE), (j.rows || []).map(prepareRow));
    dbState.remoteTotal = j.total || 0;
    if(first && j.facets){ dbState.country = fillSelect("db-country", j.facets.countries || [], dbState.country); dbState.lang = fillSelect("db-lang", j.facets.languages || [], dbState.lang); $("mode-db-n").textContent = (j.all || 0).toLocaleString(lang === "es" ? "es" : "en"); }
    dbDraw();
  }catch(e){
    dbState.remoteTotal = 0; dbDraw();
  }
}

function dbSaveFilters(){ try{ localStorage.setItem("ljc-lists-dbfilters", JSON.stringify(Object.fromEntries(DB_FILTER_KEYS.map(k => [k, dbState[k]])))); }catch(e){} }

/* Whatever throws in some viewer's browser is shown on the page, so the

window.addEventListener("error", ev => {
  try{
    const note = document.createElement("div"); note.className = "aviso";
    note.textContent = "Script error: " + (ev.message || ev.error || "unknown") + (ev.lineno ? " (line " + ev.lineno + ")" : "") + ". Please send this text to Simon.";
    (document.getElementById("results") || document.body).prepend(note);
  }catch(e){}
});

/* ---------- boot ----------
   Each step on its own, so one that fails in some browser does not leave
   the page blank: the list and the sample result come first, the Worker
   check after, and an error is shown instead of swallowed. */
function bootStep(name, fn){
  try{ return fn(); }
  catch(e){
    console.error("boot:", name, e);
    const note = document.createElement("div"); note.className = "aviso";
    note.textContent = "Something failed while loading (" + name + "): " + (e && e.message ? e.message : e) + ". Please send this text to Simon.";
    ($("results") || document.body).prepend(note);
  }
}
bootStep("buttons", () => {
  $("stype-publisher").addEventListener("click", () => setStype("Publisher"));
  $("stype-broker").addEventListener("click", () => setStype("Broker"));
});
bootStep("list", () => { $("list").value = STAR; });
bootStep("database screen", () => {
  $("mode-list").addEventListener("click", () => setMode("list"));
  $("mode-db").addEventListener("click", () => setMode("db"));
  ["db-q", "db-type", "db-country", "db-lang", "db-niche", "db-removed", "db-wide"].forEach(id => $(id).addEventListener("input", dbOnChange));
  $("db-grid").addEventListener("scroll", () => { if(mode === "db") dbDraw(); });
  $("db-rows").addEventListener("click", ev => { const row = ev.target.closest(".dbr"); if(!row || row.dataset.i == null) return; const i = Number(row.dataset.i); const r = remote ? dbRemoteRow(i) : dbState.list[i]; if(r) dbShow(r); });
  $("db-detail-x").addEventListener("click", () => { $("db-detail").hidden = true; dbState.sel = null; dbDraw(); });
  $("db-q").placeholder = t().dbSearch;
  $("mode-db-n").textContent = dbRows.length.toLocaleString("en");
  dbRestoreFilters();
});
bootStep("remembered screen", () => { let m = "list"; try{ m = localStorage.getItem("ljc-lists-mode") === "db" ? "db" : "list"; }catch(e){} if(m === "db") setMode("db"); });
bootStep("sender type", () => setStype(stype));
bootStep("language", () => applyLang());
bootStep("match", () => run());
/* The copy loaded on an earlier visit, if any: read again from the browser. */
bootStep("stored database", () => {
  idbGet("db").then(rec => { if(rec && rec.file) return loadDbFile(rec.file, { when: rec.when }); }).then(() => idbGet("rm")).then(rec => { if(rec && rec.file) return loadRmFile(rec.file); });
});
/* The Worker, if there is one next to the page; the sample result stays
   until it answers. */
checkRemote().then(() => { if(remote) run(); }).catch(e => console.error("worker check:", e));

</script>
</body></html>
