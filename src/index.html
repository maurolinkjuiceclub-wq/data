    const dbCol = flag + (e.removedRows ? dbCells(e.removedRows, true) : dbCells(e.rows));
    const offered = e.missing ? `<span class="sender">${t().notListed}</span>` : offeredCells(e.item, e.diffs);
    const terms = e.missing ? "" : termsCells(e.item);
    const note = notes[d] ? `<span class="note" data-notetext="${esc(d)}">${esc(notes[d])}</span>` : `<span class="note" data-notetext="${esc(d)}"></span>`;
    const dup = dupes.find(x => x.domain === d);
    const dupChip = dup ? `<span class="dup">${esc(t().dupChip(dup.count, dup.conflicts.map(c => `${t().niche[c.niche]} ${formatPrice(c.first)} vs ${formatPrice(c.other)}`).join(", ")))}</span>` : "";
    return `<tr class="${done.trim()}" data-row="${esc(d)}"><td class="dom"><button type="button" class="domlink" data-open="${esc(d)}" title="${esc(t().openInDb)}">${esc(d)}</button><button type="button" class="notebtn" data-note="${esc(d)}" title="${esc(t().noteBtn)}">✎</button>${e.item.path ? `<span class="sender">${esc(e.item.path)}</span>` : ""}${dupChip}${note}</td><td data-th="${esc(t().thOffered)}">${offered}</td><td class="dbc" data-th="${esc(kind === "removed" ? t().thRemoved : t().thDb)}">${dbCol}</td><td class="ancha" data-th="${esc(t().thTerms)}">${terms}</td><td class="dec" data-th="${esc(t().thDecision)}">${decisionCell(d)}</td></tr>`;
  }).join("");
  return `<div class="tabla-wrap"><table class="outreach"><thead><tr><th>${t().thDomain}</th><th>${t().thOffered}</th><th>${kind === "removed" ? t().thRemoved : t().thDb}</th><th>${t().thTerms}</th><th>${t().thDecision}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* The decisions every row on this tab can take, for the batch buttons. */
function batchKeys(entries){
  const counts = {};
  entries.forEach(e => decisionKeys(e.item.domain).forEach(k => { counts[k] = (counts[k] || 0) + 1; }));
  return ["accept", "webmaster", "ask", "reject", "remove"].filter(k => counts[k]);
}
let curRow = null;   /* domain of the row the keys act on */
function currentEntries(){
  if(!groups) return [];

  const byView = { changed: groups.changed, unknown: groups.unknown, unchanged: groups.unchanged, removed: groups.removed, missing: groups.missing || [], all };
  return byView[view] || [];

function renderTable(){
  const entries = currentEntries();

  el.innerHTML = table(shown, view === "removed" ? "removed" : view);
  const n = $("shownn"); if(n) n.textContent = shown.length === entries.length ? "" : t().shownN(shown.length, entries.length);

/* Batch: the same decision on every row shown, where the row offers it. */
function decideShown(dec){
  const shown = shownEntries(currentEntries());
  shown.forEach(e => {
    const d = e.item.domain; if(written[d]) return;
    if(!dec) delete decisions[d];
    else if(!decisionKeys(d).includes(dec)) return;
    /* With the sheet connected an Accept is a write: one per row, as a click. */
    else if(remote && remote.write && dec === "accept"){ if(decisions[d] !== "accept") decide(d, "accept"); }
    else decisions[d] = dec;
  });
  saveDecisions(); renderTable();
  const p = $("progreso"); if(p) p.innerHTML = progressHtml();
  renderExport();
}
function setCurRow(d, scroll){
  curRow = d;
  $("results").querySelectorAll("tr.cur").forEach(tr => tr.classList.remove("cur"));
  const tr = d ? $("results").querySelector(`tr[data-row="${CSS.escape(d)}"]`) : null;
  if(tr){ tr.classList.add("cur"); if(scroll) tr.scrollIntoView({ block: "nearest" }); }
}
function decide(d, dec){
  if(written[d]) return;
  if(remote && remote.write && dec === "accept" && decisions[d] !== "accept"){ const b = $("results").querySelector(`button[data-dom="${CSS.escape(d)}"][data-dec="accept"]`); if(b) acceptRemote(d, b); return; }
  if(!dec || decisions[d] === dec) delete decisions[d]; else if(decisionKeys(d).includes(dec)) decisions[d] = dec; else return;
  saveDecisions(); refreshRow(d);
}
/* Notes: an inline box under the domain, kept with the decisions. */
function editNote(d){
  const span = $("results").querySelector(`.note[data-notetext="${CSS.escape(d)}"]`); if(!span) return;
  if(span.querySelector("input")) { span.querySelector("input").focus(); return; }
  const inp = document.createElement("input"); inp.className = "noteinp"; inp.value = notes[d] || ""; inp.placeholder = t().notePh;
  const done = () => { const v = inp.value.trim(); if(v) notes[d] = v; else delete notes[d]; saveDecisions(); span.textContent = v; renderExport(); };
  inp.addEventListener("keydown", ev => { if(ev.key === "Enter"){ ev.preventDefault(); inp.blur(); } if(ev.key === "Escape"){ inp.value = notes[d] || ""; inp.blur(); } ev.stopPropagation(); });

document.addEventListener("keydown", e => {

/* The reply to the sender (house rule 5 of the desk): thanks, what was
   updated, and only the questions the rows leave open. A finished thread

function draftReply(){
  const accepted = items.filter(i => decisions[i.domain] === "accept");
  const asks = items.filter(i => decisions[i.domain] === "ask");
  if(!accepted.length && !asks.length) return { text: "", questions: 0 };
  const lt = lastParsed ? listTermsOf(lastParsed) : { adminComments: [], priceValidity: "" };
  const listText = (lastParsed ? lastParsed.skipped.map(x => x.text).join(" ") : "") + " " + items.map(i => i.terms || "").join(" ");
  const saysUnlicensed = /unlicen[cs]ed|non[- ]?gamstop|licen[cs]ed (casinos?|gambling|operators?) only|only (properly |duly )?licen[cs]ed|gambling \(legal\)|illegal gambling/i.test(listText) || items.some(i => i.prices.unlicensedCasino);
  const saysValidity = !!lt.priceValidity || /valid (until|till|for)|validity|fixed price|festpreis|not fixed|negotiable/i.test(listText);
  const lines = [];
  lines.push("Hello,");
  lines.push("");
  lines.push("Thank you for the list.");
  if(accepted.length) lines.push(`We have updated ${accepted.length === 1 ? "the site" : accepted.length + " sites"} in our database${asks.length ? " and have a few questions about the rest" : ""}.`);
  let q = 0;
  if(asks.length){
    lines.push("");
    for(const i of asks){
      const f = termsOf(i); const want = [];
      const priced = NICHES.filter(n => i.prices[n]);
      if(!priced.length) want.push("your price for an article with a dofollow link");
      else {
        if(!i.prices.casino) want.push("whether you accept casino or betting links, and at what price");
        if(!i.prices.crypto && !i.prices.forex) want.push("whether you accept crypto or forex links, and at what price");
      }
      if(!f.linkType) want.push("whether the link is dofollow");
      if(!f.placement) want.push("whether the article stays permanently");
      if(f.sponsorTag === "" && !/sponsored|marked|tag/i.test(i.terms || "")) want.push("whether the article is marked as sponsored");
      if(!want.length) want.push("could you confirm the price and conditions");
      lines.push(`- ${i.domain}: ${want.join("; ")}.`);
      q += want.length;
    }
  }
  const general = [];
  if(!saysUnlicensed) general.push("Do you accept unlicensed casinos, and at what price?");
  if(!saysValidity) general.push("How long will these prices stay valid for us?");
  if(general.length && (asks.length || accepted.length)){
    lines.push("");
    general.forEach(g => { lines.push(g); q++; });
  }
  lines.push("");
  lines.push(q ? "Thank you in advance." : "Thank you again, everything is noted.");
  lines.push("");
  lines.push("Best regards,");
  return { text: lines.join("\n"), questions: q };
}

/* SheetJS is loaded only when an Excel file arrives, from cdnjs (the only
   script host the page may use), pinned. CSV and text need nothing. */
const SHEETJS = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
let sheetjs = null;
function loadSheetJS(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(sheetjs) return sheetjs;
  sheetjs = new Promise((ok, no) => {
    const s = document.createElement("script"); s.src = SHEETJS; s.async = true;
    s.onload = () => window.XLSX ? ok(window.XLSX) : no(new Error("no XLSX"));
    s.onerror = () => { sheetjs = null; no(new Error("load failed")); };
    document.head.appendChild(s);
  });
  return sheetjs;
}
/* pdf.js the same way, for rate cards sent as PDF (businessamlive sent one
   on 05/10). A PDF has no lines: the text of each page is rebuilt from the
   glyph positions, one line per baseline, left to right. The pinned version
   is 4.10.38; the worker is loaded from the same place. The text of a page
   is rebuilt by pdfTextOf in the module: lines, and columns when it is a
   table. */
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";
const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
let pdfjs = null;
function loadPdfJS(){
  if(pdfjs) return pdfjs;
  pdfjs = import(PDFJS).then(m => { m.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; return m; }, e => { pdfjs = null; throw e; });
  return pdfjs;
}
async function pdfText(buf){
  const lib = await loadPdfJS();
  const doc = await lib.getDocument({ data: buf }).promise;
  const pages = [];
  for(let n = 1; n <= doc.numPages; n++){
    const page = await doc.getPage(n);
    pages.push(pdfTextOf((await page.getTextContent()).items));
  }
  return { text: pages.join("\n\n"), pages: doc.numPages };
}

  ["Terms", 230], ["Updated", 100]

function dbSourceRows(){ return dbState.removed ? rmRows : dbRows; }
/* Facets once per source; the rows themselves are already prepared. */
let facetCache = new WeakMap();
function dbFacetsFor(rows){
  let f = facetCache.get(rows);
  if(!f){ f = facetsOf(rows); facetCache.set(rows, f); }
  return f;
}
/* Rebuilds a <select> and returns the value it shows, so the state can be
   written back: a country kept from the other tab that this tab does not
   have must not keep filtering invisibly (review of 08/10). */
function fillSelect(id, values, keep){
  const sel = $(id); const first = sel.options[0];
  sel.innerHTML = ""; sel.appendChild(first);
  values.forEach(v => { const o = document.createElement("option"); o.value = v; o.textContent = v; sel.appendChild(o); });
  sel.value = values.includes(keep) ? keep : "";

}

/* --- the Worker's pages, 300 rows each, fetched for the window on screen --- */
const PAGE = 300;
function dbRemoteRow(i){
  const page = Math.floor(i / PAGE), rows = dbState.remotePages.get(page);
  if(rows === undefined){ dbRemoteFetch(page * PAGE, false); dbState.remotePages.set(page, null); return null; }
  return rows ? rows[i - page * PAGE] : null;
}
function dbRemoteQuery(offset){
  const p = new URLSearchParams({ offset: String(offset), limit: String(PAGE) });
  if(dbState.q.trim()) p.set("q", dbState.q.trim());
  if(dbState.type) p.set("type", dbState.type);
  if(dbState.country) p.set("country", dbState.country);
  if(dbState.lang) p.set("lang", dbState.lang);

async function dbRemoteFetch(offset, first){
  const key = dbRemoteQuery(offset);
  try{
    const r = await fetch(API + "/rows?" + key);
    if(!r.ok) throw new Error(String(r.status));
    const j = await r.json();
    if(dbRemoteQuery(offset) !== key) return;   /* filters changed meanwhile */
    dbState.remotePages.set(Math.floor(offset / PAGE), (j.rows || []).map(prepareRow));
    dbState.remoteTotal = j.total || 0;
    if(first && j.facets){ dbState.country = fillSelect("db-country", j.facets.countries || [], dbState.country); dbState.lang = fillSelect("db-lang", j.facets.languages || [], dbState.lang); $("mode-db-n").textContent = (j.all || 0).toLocaleString(lang === "es" ? "es" : "en"); }

  $("of-linked").addEventListener("input", () => { offer.linked = $("of-linked").value; linkedSet = parseLinked(offer.linked); $("of-linked-n").textContent = linkedSet.size ? t().ofLinkedN(linkedSet.size) : ""; saveOffer(); ofDraw(); });
  /* The export as it comes: Ahrefs' Referring domains (CSV in UTF-8 or
     UTF-16, or Excel) or the client sheet. Every cell that is a domain or
     a URL counts; the rest (numbers, words) is left alone. */
  $("of-linked-file").addEventListener("change", async () => {
    const f = $("of-linked-file").files && $("of-linked-file").files[0]; if(!f) return;
    $("of-linked-note").textContent = t().fileLoading;
    try{
      let cells = [];
      if(/\.(xlsx|xls|xlsm|ods)$/i.test(f.name)){
        const XLSX = await loadSheetJS();
        const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
        wb.SheetNames.forEach(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: "" }).forEach(r => r.forEach(c => cells.push(String(c)))));
      }else{
        const buf = new Uint8Array(await f.arrayBuffer());
        const utf16 = (buf[0] === 0xFF && buf[1] === 0xFE) || (buf.length > 3 && buf[1] === 0 && buf[3] === 0);
        const text = new TextDecoder(utf16 ? "utf-16le" : "utf-8").decode(buf);
        cells = text.split(/[\r\n]+/).flatMap(l => l.split(/[\t,;]/)).map(c => c.replace(/^"|"$/g, "").trim());
      }
      const found = new Set();
      cells.forEach(c => { const d = normaliseDomain(c); if(d && /^[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}$/.test(d.domain)) found.add(d.domain); });
      const had = parseLinked($("of-linked").value);
      const fresh = [...found].filter(d => !had.has(d));
      if(fresh.length){ $("of-linked").value = ($("of-linked").value.trim() ? $("of-linked").value.trim() + "\n" : "") + fresh.join("\n"); $("of-linked").dispatchEvent(new Event("input")); }
      $("of-linked-note").textContent = found.size ? t().ofLinkedRead(fresh.length, f.name) : t().ofLinkedNone(f.name);
    }catch(e){ $("of-linked-note").textContent = t().fileFail; }
    $("of-linked-file").value = "";
  });
  $("of-grid").addEventListener("scroll", () => { if(mode === "offer") ofDraw(); });
  $("of-rows").addEventListener("click", ev => { const row = ev.target.closest(".dbr"); if(!row || row.dataset.i == null) return; const i = Number(row.dataset.i); const r = remote ? ofRemoteRow(i) : ofState.list[i]; if(r) ofToggle(r); });
  $("of-items").addEventListener("input", ev => {
    const i = Number(ev.target.dataset.i); const it = offer.items[i]; if(!it) return;
    if(ev.target.classList.contains("ofprice")){ it.price = ev.target.value === "" ? null : Number(ev.target.value); it.typed = true; }
    if(ev.target.classList.contains("ofcomment")) it.comment = ev.target.value;
    const sum = offer.items.reduce((a, x) => a + (Number(x.price) || 0), 0);
    $("of-total").textContent = t().ofTotal(offer.items.length, sum);
    outputs.offer = offerOutput(); $("of-tsv").value = [outputs.offer.cols.join("\t")].concat(outputs.offer.rows.map(r => outputs.offer.cols.map(c => String(r[c] ?? "")).join("\t"))).join("\n");
    saveOffer();
  });
  $("of-items").addEventListener("click", ev => { const b = ev.target.closest(".ofx"); if(!b) return; offer.items.splice(Number(b.dataset.i), 1); saveOffer(); renderBasket(); ofDraw(); });
  $("of-client").addEventListener("input", () => { offer.client = $("of-client").value; saveOffer(); });
  $("of-label").addEventListener("input", () => { offer.label = $("of-label").value; saveOffer(); });
  $("of-hist").addEventListener("change", () => { if($("of-hist").value) openOffer($("of-hist").value); });
  $("of-new").addEventListener("click", newOffer);
  $("of-copy").addEventListener("click", () => copyFrom("of-tsv", "of-note"));
  $("of-csv").addEventListener("click", () => downloadCsv(outputs.offer));
  $("of-xlsx").addEventListener("click", () => downloadXlsx(outputs.offer, "of-note"));
  $("of-q").placeholder = t().dbSearch; $("of-topic").placeholder = t().ofTopic;
  ofRestoreFilters(); fillOfferHist(); renderBasket();
  /* The offer that was open last time, back with its rows. */
  let cur = ""; try{ cur = localStorage.getItem(OFFERS_KEY + ":current") || ""; }catch(e){}
  if(cur) openOffer(cur);
});

/* ---------- boot ----------
   Each step on its own, so one that fails in some browser does not leave
   the page blank: the list and the sample result come first, the Worker
   check after, and an error is shown instead of swallowed. */
function bootStep(name, fn){
  try{ return fn(); }
  catch(e){
    console.error("boot:", name, e);
    const note = document.createElement("div"); note.className = "aviso";
    note.textContent = "Something failed while loading (" + name + "): " + (e && e.message ? e.message : e) + ". Please send this text to Simon.";
    ($("results") || document.body).prepend(note);
  }
}
bootStep("buttons", () => {
  document.querySelectorAll("[data-stype]").forEach(b => b.addEventListener("click", () => setStype(b.dataset.stype)));
  $("hist").addEventListener("change", () => { if($("hist").value !== "") openHistory(Number($("hist").value)); });
  $("help").addEventListener("click", () => { const open = $("helppanel").hidden; $("helppanel").hidden = !open; $("help").setAttribute("aria-expanded", String(open)); });
  loadHistory();
  $("min-dr").value = mins.dr; $("min-traffic").value = mins.traffic;
  ["dr", "traffic"].forEach(k => $("min-" + k).addEventListener("change", () => { mins[k] = $("min-" + k).value; try{ localStorage.setItem("ljc-lists-mins", JSON.stringify(mins)); }catch(e){} if(groups) renderTable(); }));
});
bootStep("list", () => { $("list").value = STAR; });
bootStep("database screen", () => {
  $("mode-list").addEventListener("click", () => setMode("list"));
  $("mode-db").addEventListener("click", () => setMode("db"));
  ["db-q", "db-type", "db-country", "db-lang", "db-niche", "db-removed", "db-wide"].forEach(id => $(id).addEventListener("input", dbOnChange));
  $("db-grid").addEventListener("scroll", () => { if(mode === "db") dbDraw(); });
  $("db-rows").addEventListener("click", ev => { const row = ev.target.closest(".dbr"); if(!row || row.dataset.i == null) return; const i = Number(row.dataset.i); const r = remote ? dbRemoteRow(i) : dbState.list[i]; if(r) dbShow(r); });
  $("db-detail-x").addEventListener("click", () => { $("db-detail").hidden = true; dbState.sel = null; dbDraw(); });
  $("db-q").placeholder = t().dbSearch;
  $("mode-db-n").textContent = dbRows.length.toLocaleString("en");
  dbRestoreFilters();
});
bootStep("remembered screen", () => { let m = "list"; try{ const v = localStorage.getItem("ljc-lists-mode"); m = v === "db" || v === "offer" ? v : "list"; }catch(e){} if(m !== "list") setMode(m); });
bootStep("sender type", () => setStype(stype));
/* Inside the desk (iframe at /listas/?embed=1&lang=es&theme=dark): the
   desk's bar is above, so the title and the language switch go; the
   language and theme follow the desk's. */
bootStep("embedded", () => {
  const q = new URLSearchParams(location.search);
  if(q.get("embed") === "1") document.body.classList.add("embed");
  if(EN_MESA) $("apps").hidden = false;
  if(q.get("lang") === "es" || q.get("lang") === "en"){ lang = q.get("lang"); try{ localStorage.setItem("ljc-lists-lang", lang); }catch(e){} }
  if(q.get("theme") === "dark" || q.get("theme") === "light"){ temaElegido = q.get("theme"); aplicarTema(); }
});
/* And afterwards, when the desk switches language or theme, it says so by
   message (montarListas in the desk's mesa.html). */
window.addEventListener("message", e => {
  if(e.origin !== location.origin || !e.data || e.data.tipo !== "mesa-listas") return;
  if(e.data.lang === "es" || e.data.lang === "en"){ lang = e.data.lang; try{ localStorage.setItem("ljc-lists-lang", lang); }catch(err){} applyLang(); }
  temaElegido = e.data.theme === "dark" || e.data.theme === "light" ? e.data.theme : ""; aplicarTema();
});
/* The theme, as the desk's: follow the system, dark, light, one button
   that cycles and says which with its icon. The key is the desk's own when
   the page is served by it, so both agree. */
bootStep("theme", () => { aplicarTema(); $("tema").addEventListener("click", () => { temaElegido = temaElegido === "" ? "dark" : temaElegido === "dark" ? "light" : ""; try{ localStorage.setItem(TEMA_KEY, temaElegido); }catch(e){} aplicarTema(); }); });
/* Who is signed in, from the desk's Worker, in the blue bubble. */
bootStep("who", () => {
  if(!EN_MESA) return;
  fetch("/api/quien", { headers: { accept: "application/json" } }).then(r => r.ok ? r.json() : null).then(j => {
    if(!j || !j.email) return;
    const w = $("whoami"); w.textContent = ""; const av = document.createElement("span"); av.className = "whoami-av"; av.setAttribute("aria-hidden", "true"); av.textContent = j.email.charAt(0).toUpperCase();
    const tx = document.createElement("span"); tx.className = "txt"; tx.textContent = j.email;
    w.appendChild(av); w.appendChild(tx); w.title = t().whoamiLbl + " " + j.email; w.hidden = false;
  }).catch(() => {});
});
bootStep("language", () => applyLang());
bootStep("match", () => run());
/* The copy loaded on an earlier visit, if any: read again from the browser. */
bootStep("stored database", () => {
  idbGet("db").then(rec => {
    if(!rec || !Array.isArray(rec.db)) return;
    dbRows = rec.db; rmRows = Array.isArray(rec.rm) ? rec.rm : []; rmFromWorkbook = !!rec.rmFromWorkbook;
    dbSource = rec.name; dbLoadedAt = new Date(rec.when);
    rebuild();
  });
});
/* The Worker, if there is one next to the page; the sample result stays
   until it answers. */
/* When it answers, whichever screen is open is redrawn from it: the
   Database and Offers screens may have drawn the local rows meanwhile. */
checkRemote().then(() => { if(remote){ run(); if(mode === "db") dbRefresh(); if(mode === "offer") ofRefresh(); } }).catch(e => console.error("worker check:", e));

</script>
