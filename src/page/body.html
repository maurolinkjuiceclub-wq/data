<header class="bar">
  <a class="home" id="home" href="/" hidden aria-label="Start page">LJC</a>
  <h1 class="marca" data-i18n="title">Site lists</h1>
  <span class="seg modes" role="tablist" aria-label="Screen"><button type="button" id="mode-list" role="tab" aria-selected="true" data-i18n="modeList">List</button><button type="button" id="mode-db" role="tab" aria-selected="false"><span data-i18n="modeDb">Database</span> <span class="n" id="mode-db-n"></span></button><button type="button" id="mode-offer" role="tab" aria-selected="false" data-i18n="modeOffer">Offers</button></span>
  <div class="estado">
    <button type="button" class="sello" id="state" aria-expanded="false" aria-controls="dbpanel"></button>
    <button type="button" class="btn sutil" id="help" aria-expanded="false" aria-controls="helppanel">Help</button><span class="lang" role="group" aria-label="Language"><button type="button" id="lang-en" aria-pressed="true">EN</button><button type="button" id="lang-es" aria-pressed="false">ES</button></span>
  </div>
</header>

<div class="dbpanel" id="helppanel" hidden><div class="dbpanel-in"><ol class="helpsteps" id="helplist"></ol></div></div>
<div class="dbpanel" id="dbpanel" hidden>
  <div class="dbpanel-in">
    <div><span class="lbl" data-i18n="db">Database</span><p class="hint" data-i18n="dbhint"></p></div>
    <div class="par">
      <div><label for="dbfile" data-i18n="dbfileL">Copy of the sheet · .xlsx (both tabs) or .csv</label><input type="file" id="dbfile" accept=".xlsx,.xls,.xlsm,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv"></div>
      <div><label for="rmfile" data-i18n="rmfileL">removed sites · .csv, when the copy is a CSV</label><input type="file" id="rmfile" accept=".csv,text/csv"></div>
    </div>
    <p class="hint" data-i18n="dbnever">This page never writes to the database. Accept builds the rows; a person pastes them into the sheet.</p>
    <div class="actions"><span class="dbmeta" id="dbmeta"></span><button type="button" class="btn sutil" id="refresh" data-i18n="refresh" hidden></button><button type="button" class="btn sutil" id="reset" data-i18n="reset"></button></div>
  </div>
</div>

<div class="shell" id="screen-list">
  <aside class="rail">
    <form class="rev-form" onsubmit="return false">
      <div><label for="sender" data-i18n="sender">Sender</label><input type="text" id="sender" value="redaktion@sternmagazin.example" autocomplete="off"></div>
      <div><label data-i18n="stype">The sender is</label><span class="seg stype" role="group"><button type="button" id="stype-publisher" data-stype="Publisher" class="on-type" data-i18n="typePublisher">Publisher</button><button type="button" id="stype-exclusive" data-stype="Exclusive" data-i18n="typeExclusive">Exclusive</button><button type="button" id="stype-broker" data-stype="Broker" data-i18n="typeBroker">Broker</button><button type="button" id="stype-unsure" data-stype="Unsure" data-i18n="typeUnsure">Unsure</button></span></div>
      <div><label for="label" data-i18n="list">List</label><input type="text" id="label" value="example list 05/10" autocomplete="off"><select id="hist" hidden aria-label="Previous lists"></select></div>
      <div class="mins"><label data-i18n="mins">Sellable metrics, minimum</label><span class="minrow"><label for="min-dr">DR</label><input type="number" id="min-dr" min="0" step="1" inputmode="numeric"><label for="min-traffic" data-i18n="minTraffic">traffic</label><input type="number" id="min-traffic" min="0" step="100" inputmode="numeric"></span><p class="hint" data-i18n="minshint"></p></div>
      <div><label for="list" data-i18n="paste">Paste the list</label><textarea id="list" spellcheck="false"></textarea></div>
      <div><label for="listfile" data-i18n="orfile">or load the file they sent</label><input type="file" id="listfile" accept=".xlsx,.xls,.csv,.txt,.tsv,.pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv,text/plain,application/pdf"><p class="said" id="filenote"></p></div>
      <div class="actions"><button type="button" class="btn primary" id="match" data-i18n="match">Match</button></div>
      <p class="said" id="parsenote"></p>
    </form>
  </aside>

  <main class="work">
    <div id="results"></div>
    <section class="export" id="export" hidden>
      <button type="button" class="panel-h" id="export-h" aria-expanded="true" aria-controls="export-body"><span class="caret" aria-hidden="true">▾</span><span id="export-t"></span></button>
      <div id="export-body">
        <p class="hint" data-i18n="rowshint"></p>
        <div class="aviso" id="export-warn" hidden></div>
        <div class="tabla-wrap" id="export-prev"></div>
        <div class="actions"><button type="button" class="btn" id="copy" data-i18n="copy">Copy</button><button type="button" class="btn" id="dl-csv" data-i18n="dlCsv">Download CSV</button><button type="button" class="btn" id="dl-xlsx" data-i18n="dlXlsx">Download .xlsx</button><span class="said" id="copynote"></span></div>
        <textarea id="tsv" class="inp" readonly spellcheck="false" hidden></textarea>
      </div>
    </section>
    <section class="export" id="wm" hidden>
      <button type="button" class="panel-h" id="wm-h" aria-expanded="true" aria-controls="wm-body"><span class="caret" aria-hidden="true">▾</span><span id="wm-t"></span></button>
      <div id="wm-body">
        <p class="hint" data-i18n="wmhint"></p>
        <div class="tabla-wrap" id="wm-prev"></div>
        <div class="actions"><button type="button" class="btn" id="wm-copy" data-i18n="copy">Copy</button><button type="button" class="btn" id="wm-csv" data-i18n="dlCsv">Download CSV</button><button type="button" class="btn" id="wm-xlsx" data-i18n="dlXlsx">Download .xlsx</button><span class="said" id="wm-note"></span></div>
        <textarea id="wm-tsv" class="inp" readonly spellcheck="false" hidden></textarea>
      </div>
    </section>
    <section class="export" id="ask" hidden>
      <button type="button" class="panel-h" id="ask-h" aria-expanded="true" aria-controls="ask-body"><span class="caret" aria-hidden="true">▾</span><span id="ask-t"></span></button>
      <div id="ask-body">
        <p class="hint" data-i18n="askhint"></p>
        <textarea id="ask-txt" class="inp draft" spellcheck="false"></textarea>
        <div class="actions"><button type="button" class="btn" id="ask-copy" data-i18n="copy">Copy</button><span class="said" id="ask-note"></span></div>
      </div>
    </section>
    <section class="export" id="rm" hidden>
      <button type="button" class="panel-h" id="rm-h" aria-expanded="true" aria-controls="rm-body"><span class="caret" aria-hidden="true">▾</span><span id="rm-t"></span></button>
      <div id="rm-body">
        <p class="hint" data-i18n="rmhint"></p>
        <div class="tabla-wrap" id="rm-prev"></div>
        <div class="actions"><button type="button" class="btn" id="rm-copy" data-i18n="copy">Copy</button><button type="button" class="btn" id="rm-csv" data-i18n="dlCsv">Download CSV</button><button type="button" class="btn" id="rm-xlsx" data-i18n="dlXlsx">Download .xlsx</button><span class="said" id="rm-note"></span></div>
        <textarea id="rm-tsv" class="inp" readonly spellcheck="false" hidden></textarea>
      </div>
    </section>
  </main>
</div>

<div class="dbscreen" id="screen-db" hidden>
  <div class="dbtools">
    <input type="search" id="db-q" class="dbq" autocomplete="off" spellcheck="false">
    <select id="db-type"><option value="" data-i18n="fType">Type: all</option><option value="Publisher">Publisher</option><option value="Broker">Broker</option><option value="-" data-i18n="fTypeBlank">Type: blank</option></select>
    <select id="db-country"><option value="" data-i18n="fCountry">Country: all</option></select>
    <select id="db-lang"><option value="" data-i18n="fLang">Language: all</option></select>
    <select id="db-niche"><option value="" data-i18n="fNiche">Priced for: any</option><option value="casino">Casino</option><option value="unlicensedCasino">Unlicensed casino</option><option value="crypto">Crypto</option><option value="forex">Forex</option><option value="cbd">CBD</option><option value="dating">Dating</option><option value="general">General</option></select>
    <label class="chk"><input type="checkbox" id="db-removed"> <span data-i18n="fRemoved">removed sites</span></label>
    <label class="chk"><input type="checkbox" id="db-wide"> <span data-i18n="fWide">all 45 columns</span></label>
    <span class="said" id="db-count"></span>
  </div>
  <div class="dbmain">
    <div class="dbgrid" id="db-grid">
      <div class="dbhead" id="db-head"></div>
      <div class="dbbody" id="db-body"><div class="dbspacer" id="db-top"></div><div id="db-rows"></div><div class="dbspacer" id="db-bottom"></div></div>
    </div>
    <aside class="dbdetail" id="db-detail" hidden>
      <div class="dbdetail-h"><b id="db-detail-dom"></b><button type="button" class="btn sutil" id="db-detail-x" aria-label="Close">×</button></div>
      <dl id="db-detail-body"></dl>
    </aside>
  </div>
</div>

<div class="dbscreen" id="screen-offer" hidden>
  <div class="dbtools">
    <input type="search" id="of-q" class="dbq" autocomplete="off" spellcheck="false">
    <select id="of-niche" aria-label="Offer for"><option value="casino">Casino</option><option value="unlicensedCasino">Unlicensed casino</option><option value="crypto">Crypto</option><option value="forex">Forex</option><option value="cbd">CBD</option><option value="dating">Dating</option><option value="general">General</option></select>
    <select id="of-type"><option value="" data-i18n="fType">Type: all</option><option value="Publisher">Publisher</option><option value="Broker">Broker</option><option value="-" data-i18n="fTypeBlank">Type: blank</option></select>
    <select id="of-country"><option value="" data-i18n="fCountry">Country: all</option></select>
    <select id="of-lang"><option value="" data-i18n="fLang">Language: all</option></select>
    <label class="chk"><span data-i18n="ofMinDr">min DR</span> <input type="number" id="of-min-dr" class="ofmin" min="0" step="1" inputmode="numeric"></label>
    <label class="chk"><span data-i18n="ofMinTraffic">min traffic</span> <input type="number" id="of-min-traffic" class="ofmin" min="0" step="100" inputmode="numeric"></label>
    <select id="of-sort"><option value="dr" data-i18n="sortDr">DR, highest first</option><option value="traffic" data-i18n="sortTraffic">Traffic, highest first</option><option value="rd" data-i18n="sortRd">Referring domains, highest first</option><option value="price" data-i18n="sortPriceUp">Cheapest first</option><option value="" data-i18n="sortDbOrder">Sheet order</option></select>
    <span class="said" id="of-count"></span>
  </div>
  <div class="dbmain ofmain">
    <div class="dbgrid" id="of-grid">
      <div class="dbhead" id="of-head"></div>
      <div class="dbbody"><div class="dbspacer" id="of-top"></div><div id="of-rows"></div><div class="dbspacer" id="of-bottom"></div></div>
    </div>
    <aside class="basket" id="of-basket">
      <div class="basket-h">
        <div class="par"><div><label for="of-client" data-i18n="ofClient">Client</label><input type="text" id="of-client" autocomplete="off"></div><div><label for="of-label" data-i18n="ofLabel">Offer name</label><input type="text" id="of-label" autocomplete="off"></div></div>
        <select id="of-hist" hidden aria-label="Previous offers"></select>
        <p class="hint" data-i18n="ofHint"></p>
      </div>
      <div id="of-items"></div>
      <div class="basket-f">
        <span class="said" id="of-total"></span>
        <div class="actions"><button type="button" class="btn" id="of-copy" data-i18n="copy">Copy</button><button type="button" class="btn" id="of-csv" data-i18n="dlCsv">Download CSV</button><button type="button" class="btn" id="of-xlsx" data-i18n="dlXlsx">Download .xlsx</button><button type="button" class="btn sutil" id="of-new" data-i18n="ofNew">New offer</button><span class="said" id="of-note"></span></div>
        <textarea id="of-tsv" class="inp" readonly spellcheck="false" hidden></textarea>
      </div>
    </aside>
  </div>
</div>
